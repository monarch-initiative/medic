name: Create Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers the workflow on version tags (e.g., v1.0.0)

permissions:
  contents: write

# The data assets are NOT uploaded here, and cannot be.
#
# This workflow used to upload nine files from `medi/data/...`, the Kedro tree deleted in
# 96f520d. Every one of those steps would fail on a missing path, so tagging produced a
# broken job rather than a release (issue #37).
#
# They are not simply repointed at `products/` and `exports/` because those are gitignored
# build outputs: a fresh checkout does not contain them, and CI cannot regenerate them —
# `just build-all` needs the manually-provided sources (`background/grls.zip`,
# `background/cder_drugs_final_all.csv`) and paid API keys that are not available to a
# runner.
#
# So the tag job does the part it *can* do reproducibly — create the draft release, carry
# the licensing terms — and the data is attached from a local build:
#
#     just build-all
#     just gh-release vX.Y.Z
#
# That recipe finds this draft, uploads `products/*.yaml` + `exports/*` into it (skipping
# empty stubs), and leaves it for review. Which assets may lawfully ship is still open —
# see issue #37 on the MedDRA, Russia and China redistribution terms.

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from the commit range

      # Created as a DRAFT, matching `just gh-release`'s default: a release is reviewed
      # before it is published, and the data assets are not attached yet at this point.
      #
      # Uses the gh CLI rather than actions/create-release + actions/upload-release-asset,
      # both of which GitHub archived in 2021.
      - name: Create draft release with licensing terms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # EMA and PMDA both require attribution and both feed the merged on-label
          # product, so the notice travels with the release, not just the repository.
          # `--notes` (not `--notes-file`) is the flag gh documents as composing with
          # `--generate-notes`: this text is prepended to the generated changelog.
          notes=$(cat <<EOF
          Data assets (\`products/*.yaml\`, \`exports/*\`) are attached from a local build
          with \`just gh-release ${TAG}\` — they cannot be built on a runner.

          Sources carry differing upstream terms, several requiring attribution.
          See \`LICENSING.md\`, attached to this release.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading licensing terms only."
            gh release upload "$TAG" LICENSING.md --clobber
          else
            gh release create "$TAG" LICENSING.md \
              --draft \
              --title "MeDIC ${TAG}" \
              --notes "$notes" \
              --generate-notes
          fi

          gh release view "$TAG" --json url --jq .url
