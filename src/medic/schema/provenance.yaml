id: https://w3id.org/monarch-initiative/transformation-provenance
name: transformation-provenance
title: Transformation-Provenance Model
description: >-
  A standalone, reusable LinkML schema for recording the step-by-step transformation
  of a messy source string into a canonical identifier (extract -> translate -> ground
  -> normalize). Every step records its incoming and outgoing value (invariant I-8) and
  every transform action + failure-mode flag is a controlled enum. Names nothing
  domain-specific so it lifts into any ETL / NER-NEL / ontology-curation pipeline.

  NOTE: the namespace id below is a placeholder; the w3id.org redirect is not yet
  registered (spec 2026-07-28, section 8.1). Register before release.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  tprov: https://w3id.org/monarch-initiative/transformation-provenance/
  skos: http://www.w3.org/2004/02/skos/core#
  wikidata: http://www.wikidata.org/entity/
  xsd: http://www.w3.org/2001/XMLSchema#
default_range: string
default_prefix: tprov
imports:
  - linkml:types

enums:
  # ---------------------------------------------------------------------------
  # New provenance vocabulary
  # ---------------------------------------------------------------------------
  TransformationCategory:
    description: WHICH transformation stage a step performs (discriminator for a heterogeneous steps[] list).
    permissible_values:
      EXTRACTION:
        description: Pull a mention string out of source text or a structured field.
      TRANSLATION:
        description: Translate a non-English mention to English.
      GROUNDING:
        description: Resolve a string to an initial ontology id.
      NORMALIZATION:
        description: Map an initial id to a canonical target id.
  TransformationMethod:
    description: HOW a step was performed.
    permissible_values:
      LLM:
        description: Large language model extraction/generation.
      DETERMINISTIC_RULE:
        description: Deterministic rule application (no ML).
      LEXICAL_MATCH:
        description: Lexical/string match against a vocabulary index.
      TRANSLITERATION:
        description: Script transliteration (e.g. Cyrillic -> Latin).
      API:
        description: External service call (e.g. DeepL, RxNav).
      STRUCTURED_FIELD:
        description: Value read verbatim from a structured source column/cell.
      SOURCE_ASSERTED:
        description: >-
          The source supplied the identifier itself and MeDIC could not verify it — no match was
          performed. Recorded honestly rather than as LEXICAL_MATCH, which would claim a match
          that never ran.
      HUMAN:
        description: Manual human action.
  StepStatus:
    description: Curation lifecycle of a step — the uniform human-review hook across all stages.
    permissible_values:
      MACHINE:
        description: Machine-produced, no review lifecycle entered.
      CANDIDATE:
        description: Machine-produced, awaiting review.
      UNDER_REVIEW:
        description: A curator is reviewing this step.
      CONFIRMED:
        description: Human-approved.
      REJECTED:
        description: Human-rejected.
  AgentTypeEnum:
    description: Kind of agent that ran a step.
    permissible_values:
      HUMAN:
        description: A human being.
      AI_AGENT:
        description: An automated/AI agent or service.
  TextSpanRoleEnum:
    description: >-
      What role a chunk of source text plays in its document. Required on every TextSpan so an
      extraction can name which span it read, and so negation and entailment can be scoped to
      that span rather than to a concatenation of the whole section. Conflating a section
      header, the indication sentence and a "Limitations of Use" sentence into one string put a
      negated sentence in scope for the positive claim — see the design spec §4.3.
    permissible_values:
      SECTION_HEADER:
        description: The title of a document section (e.g. "INDICATIONS AND USAGE").
      SECTION_TEXT:
        description: The body text of a document section.
      SUBSECTION_HEADER:
        description: The title of a subsection within a section (e.g. "Limitations of Use").
      SUBSECTION_TEXT:
        description: The body text of a subsection.
      LIMITATION_STATEMENT:
        description: >-
          A sentence restricting the scope of a claim made elsewhere in the section
          ("X is not indicated for the preventive treatment of Y"). Retained rather than
          discarded, and excluded from the positive claim's negation scope.
      TABLE_HEADER:
        description: A table column or row header.
      TABLE_CELL:
        description: A single table cell (the common shape for PDF-extracted registries).
      LIST_ITEM:
        description: One item of an enumerated list.
      DOCUMENT_TITLE:
        description: The title of the document itself.
      STRUCTURED_FIELD:
        description: A named field of a structured record (a spreadsheet column, an API field).
      FULL_DOCUMENT:
        description: The whole document, when no finer structure is recoverable.
      UNKNOWN:
        description: >-
          Role not determinable from the source. Permitted so an ingester is never forced to
          guess, but a rising count here is a data-quality signal, not a resting state.
  PriorScope:
    description: What kind of producer a ConfidencePriorDefault matches.
    permissible_values:
      AGENT:
        description: A versioned model, matched on its agent_name.
      TOOL:
        description: >-
          A tool, matched on its tool name. Covers DeepL, which publishes no engine version, so
          the babelon release that called it is the only knowable identity.
  ConfidenceBasis:
    description: >-
      Where a step's confidence value came from. Required on every step (invariant I-11) so a
      reader can tell a measured score from an assumed one. Note that every confidence in MeDIC
      is a **data-quality** number — how sure we are the linking is right — never an
      evidence-strength number about the claim itself (docs/sepio-sieve-alignment.md §3).
    permissible_values:
      MEASURED:
        description: >-
          Produced by a scoring component that actually evaluated this input (a grounder match
          score, an entailment score).
      DETERMINISTIC:
        description: >-
          The step cannot be wrong, so the confidence is legitimately 1.0 — an identity
          normalization, or a verbatim read of a structured field.
      PRIOR:
        description: >-
          No score was available for this input; the value is a calibrated per-method constant
          from conf/confidence_priors.yaml. Marks the value as an assumption, not a measurement.
  ExtractionQuality:
    description: How faithfully the extracted mention string reproduces the supporting quote.
    permissible_values:
      verbatim:
        description: Output is a verbatim substring of the source.
      canonicalized:
        description: Output canonicalized (casing/spacing/lightly reworded) but same referent.
      synonym:
        description: Output is a synonym of the phrase in the source.
      not_stated:
        description: Output not literally present in the supporting quote.
  TranslationPrecision:
    description: Semantic precision of a translation relative to the source.
    permissible_values:
      exact:
        description: Translation is an exact semantic match.
      broader:
        description: Translation is broader than the source term.
      narrower:
        description: Translation is narrower than the source term.
      close:
        description: Translation is close but not exact.
  ExtractionFlag:
    description: >-
      Failure-mode signals on an extraction step — strictly about **recognising the entity
      mention in the source** (did this string really occur here, and is it the right span?).
      Signals about the *claim* the mention participates in (polarity, wrong relationship,
      wrong section) are NOT extraction failures — they live on AssertionFlag, because the
      entity can be recognised perfectly while the asserted relation is wrong. See
      FAILURE_MODES.md.

      **Which of these the pipeline emits:** only `truncated_snippet`, from
      `medic.spans.is_truncated` at merge. `hallucination`, `coreference_ambiguity` and
      `scope_narrowed` have no deterministic detector — lexical entailment cannot tell an
      invented disease from a correctly canonicalised synonym (see `_extraction_step`), and
      inferring them from a zero score would mislabel the 122 zero-entailment extractions
      that are mostly synonymy. They are **curator-supplied**, via the statement review
      store, not machine-inferred. A value with no emitter is a gap to fill, not a promise
      the products keep.
    permissible_values:
      hallucination:
        description: Entity invented, not present in the source text at all (FAILURE_MODES 5.1).
      truncated_snippet:
        description: Supporting span truncated, so the mention may not be fully supported (5.6).
      coreference_ambiguity:
        description: Subject resolved by coreference; which entity the span refers to is uncertain (5.5).
      scope_narrowed:
        description: >-
          The extracted mention is narrower than the entity the source names (a label reading
          "migraine with or without aura" extracted as "migraine with aura"). An
          entity-recognition failure, not a relation failure — see AssertionFlag for the latter.
  TriggerCueEnum:
    description: >-
      The kind of textual cue that establishes a claim. Paired with `trigger_span` (the exact
      substring), this gives an **extractive, verifiable** rationale instead of a generated
      one: the span is checked against the source text, and the cue says what kind of
      evidence it is. Enumerable, so "which claims rest on a weak cue?" is a query.
    permissible_values:
      indication_phrase:
        description: An explicit indication phrase ("is indicated for", "for the treatment of").
      contraindication_phrase:
        description: An explicit contraindication phrase ("is contraindicated in", "should not be used in").
      treatment_verb:
        description: A treatment verb without a formal indication phrase ("treats", "used to manage").
      section_header:
        description: The claim rests on the section the text came from, not on a phrase within it.
      list_membership:
        description: The entity appears in an enumerated list governed by an earlier cue phrase.
      none_found:
        description: No cue could be located and verified in the source text.
  AssertionFlag:
    description: >-
      Failure-mode signals on an **asserted claim** (a relation between entities extracted
      from a source), as opposed to the recognition of the entities themselves. The
      canonical case: "hyperthyroidism" is recognised perfectly, but the sentence lists it
      as a *depleting condition*, not an indication — the mention is right, the relation is
      wrong. See FAILURE_MODES.md §4-5.

      **Which of these the pipeline emits:** `negated_inversion` and `over_extraction` from
      `on_label_merge._polarity_flags`, `wrong_section` from `build_assertion` when the only
      cue in the quote contradicts the recorded relation. `wrong_pairing` has no detector —
      deciding which active moiety of a combination label a relation attaches to needs the
      hyperrelational context pass, not a lexical rule — so it is curator-supplied.
    permissible_values:
      negated_inversion:
        description: The source states the relation negatively; recording it positively inverts the claim (4.1/4.2).
      over_extraction:
        description: The entity is present in the text, but not in this relationship to the subject (5.2).
      wrong_section:
        description: The claim was drawn from a section that does not assert this relationship (3.5).
      wrong_pairing:
        description: The relation was attributed to the wrong subject, e.g. the wrong active moiety in a combination label (5.4).
  TranslationFlag:
    description: Failure-mode signals on a translation step.
    permissible_values:
      unreviewed_machine:
        description: Machine translation not human-reviewed (7.3).
      trade_name_source:
        description: Translated from a trade name, not the INN (7.4).
  GroundingFlag:
    description: Failure-mode signals on a grounding step.
    permissible_values:
      fuzzy:
        description: Fuzzy (edit-distance) match; curator-reviewable.
      ambiguous_resolved:
        description: Multiple candidates; one chosen.
      broadened:
        description: A qualifier was stripped, broadening the claim (11.2).
      isotope_risk:
        description: Digit-substitution edit risks isotope confusion, e.g. 13C->14C.
      formulation_stripped:
        description: Dose/form/release/pharmacopoeia noise stripped to reach the ingredient (5.4).
      rxnorm_proposed:
        description: Grounded via an RxNav substance-resolver proposal.
      script_transliteration:
        description: Reached via script transliteration, e.g. Cyrillic (2.5).
  NormalizationFlag:
    description: Failure-mode signals on a normalization step.
    permissible_values:
      no_target_xref:
        description: Target namespace publishes no xref; left un-normalized (10.2).
      deprecated_replacement:
        description: Followed an obsolete-term replaced_by pointer.

  # ---------------------------------------------------------------------------
  # Moved verbatim from grounding.yaml (keep annotations byte-identical so the
  # code-map test tests/test_grounding_schema.py::test_code_rule_maps_match_schema
  # stays green against RULE_CERTAINTY / RULE_PREDICATE in preprocess.py).
  # ---------------------------------------------------------------------------
  GroundingQualityEnum:
    description: How much string manipulation was needed to ground.
    permissible_values:
      curated:
        description: Manual assertion in the grounding SSSOM store.
      lexical_exact:
        description: Exact match to label or synonym, string unchanged.
      lexical_exact_normalized:
        description: Exact after non-semantic normalization (whitespace, comma, dashes, case, unicode).
      lexical_exact_surgery:
        description: Exact after minor semantic surgery (disease->disorder, type 1->type I).
      rxnorm_proposed:
        description: >-
          Grounded via a RxNav substance-resolver proposal (product/formulation -> ingredient,
          network-derived, curator-reviewable; see PreprocessingRuleEnum.rxnorm_resolve).
      source_asserted:
        description: >-
          The source supplied the identifier directly (a pre-grounded field) and MeDIC made no
          grounding decision of its own — so there is no matching evidence to audit. Recorded
          rather than left blank so the chain still ends where the record ends (I-8), but it is
          NOT a verified match: treat as unverified provenance.
      unresolved:
        description: No deterministic single match (includes ambiguous multi-candidate hits).
  PreprocessingRuleEnum:
    description: >-
      Controlled vocabulary of the deterministic string transforms the grounder may apply
      to a source literal before matching. The rule ids applied to a given match are
      recorded in the SSSOM ``subject_preprocessing`` slot, so every "hack to beat a label
      into shape" is transparent and auditable.

      Each value carries three annotations (a lightweight metadata mixin shared by every
      value): ``certainty`` (0-1 float — how meaning-preserving / trustworthy the transform
      is; 1.0 = no risk, lower = looser), ``rule_family`` (a coarse grouping so rules can be
      selected/aggregated later), and ``predicate`` (the SSSOM predicate a match via this
      rule is asserted with). ``certainty`` drives the per-match ``confidence`` written to
      the grounding SSSOM (code map ``RULE_CERTAINTY``/``RULE_PREDICATE`` mirrors these,
      enforced by a test).

      Applied in tier order (first single-id hit wins), with entity scoping:
      ``base_normalization`` (always) -> ``punctuation``/``lexical_surgery`` (both) ->
      ``spelling_en`` (both) -> ``spelling_inn`` + ``salt`` (drugs only) /
      ``qualifier`` (diseases only) -> ``translation`` (both) -> ``fuzzy`` (both, last
      resort). ``spelling_inn`` targets foreign INN transliterations (Russia/PMDA registries);
      ``fuzzy`` is edit-distance-1 with a unique-hit guard — deterministic but approximate,
      so its rows are proposals a curator should review, not silently trusted.
    permissible_values:
      # --- family: base (always applied; not recorded per row) ---
      base_normalization:
        description: "Unicode NFKD + diacritic drop, casefold, whitespace collapse, punctuation/bracket normalization. Always applied to both sides."
        annotations: {certainty: 1.0, rule_family: base, predicate: skos:exactMatch}
      # --- family: punctuation (structural, meaning-preserving) ---
      comma_drop_type:
        description: "'X, type N' -> 'X type N'."
        annotations: {certainty: 0.98, rule_family: punctuation, predicate: skos:exactMatch}
      hyphen_type:
        description: "'type-N' -> 'type N'."
        annotations: {certainty: 0.98, rule_family: punctuation, predicate: skos:exactMatch}
      cell_hyphen_to_space:
        description: "'T-cell' -> 'T cell' (closed token list)."
        annotations: {certainty: 0.97, rule_family: punctuation, predicate: skos:exactMatch}
      cell_space_to_hyphen:
        description: "'T cell' -> 'T-cell' (closed token list)."
        annotations: {certainty: 0.97, rule_family: punctuation, predicate: skos:exactMatch}
      # --- family: lexical_surgery (minor semantic surgery) ---
      disease_to_disorder:
        description: "'disease' -> 'disorder'."
        annotations: {certainty: 0.95, rule_family: lexical_surgery, predicate: skos:exactMatch}
      disorder_to_disease:
        description: "'disorder' -> 'disease'."
        annotations: {certainty: 0.95, rule_family: lexical_surgery, predicate: skos:exactMatch}
      arabic_to_roman:
        description: "'<indicator> N' -> '<indicator> ROMAN' (indicator-guarded)."
        annotations: {certainty: 0.95, rule_family: lexical_surgery, predicate: skos:exactMatch}
      roman_to_arabic:
        description: "'<indicator> ROMAN' -> '<indicator> N' (indicator-guarded)."
        annotations: {certainty: 0.95, rule_family: lexical_surgery, predicate: skos:exactMatch}
      strip_leading_other:
        description: "'other X' -> 'X' (broadening)."
        annotations: {certainty: 0.70, rule_family: lexical_surgery, predicate: skos:broadMatch}
      # --- family: spelling_en (English variant) ---
      brit_to_am:
        description: "British -> American spelling (closed list)."
        annotations: {certainty: 0.97, rule_family: spelling_en, predicate: skos:exactMatch}
      am_to_brit:
        description: "American -> British spelling (closed list)."
        annotations: {certainty: 0.97, rule_family: spelling_en, predicate: skos:exactMatch}
      # --- family: spelling_inn (foreign INN transliteration conventions; lever #1) ---
      inn_suffix_in_to_ine:
        description: "Foreign INN suffix '-in' -> '-ine' ('amlodipin' -> 'amlodipine'). Guarded against native -in drugs (insulin, heparin, warfarin)."
        annotations: {certainty: 0.90, rule_family: spelling_inn, predicate: skos:closeMatch}
      inn_z_to_s:
        description: "Transliteration 'z' -> 's' ('methylprednizolone' -> 'methylprednisolone')."
        annotations: {certainty: 0.88, rule_family: spelling_inn, predicate: skos:closeMatch}
      inn_ph_to_f:
        description: "'ph' -> 'f' transliteration variant."
        annotations: {certainty: 0.88, rule_family: spelling_inn, predicate: skos:closeMatch}
      inn_ti_to_thi:
        description: "'ti' -> 'thi' ('hydrochlorotiazide' -> 'hydrochlorothiazide')."
        annotations: {certainty: 0.85, rule_family: spelling_inn, predicate: skos:closeMatch}
      inn_ae_oe_to_e:
        description: "'ae'/'oe' -> 'e' transliteration variant."
        annotations: {certainty: 0.90, rule_family: spelling_inn, predicate: skos:closeMatch}
      # --- family: salt ---
      salt_ester_strip:
        description: "Strip a trailing salt/ester/hydrate word ('X sodium' -> 'X'; active moiety)."
        annotations: {certainty: 0.90, rule_family: salt, predicate: skos:closeMatch}
      # --- family: qualifier ---
      qualifier_strip:
        description: "Strip a leading clinical qualifier ('severe X' -> 'X'; broadening)."
        annotations: {certainty: 0.75, rule_family: qualifier, predicate: skos:broadMatch}
      # --- family: structural ---
      combination_split:
        description: "Split a combination/list ('A; B' -> ['A','B']) and ground each component."
        annotations: {certainty: 0.92, rule_family: structural, predicate: skos:exactMatch}
      # --- family: formulation (dose/form/release/pharmacopoeia noise around ingredients) ---
      formulation_strip:
        description: "Strip dose (150mg), dosage form (tablet/injection/cream), release (SR/ER/sustained release) and pharmacopoeia (USP/IP/BP) noise from a product string ('Ferrous Sulphate 150mg Sustained Release' -> 'ferrous sulphate'), then re-run the full ladder (composes with salt-strip + combination-split + fuzzy). Numeric-anchored + whole-word guarded so token-internal digits (B12, omega-3, vitamin D3) survive."
        annotations: {certainty: 0.80, rule_family: formulation, predicate: skos:closeMatch}
      # --- family: transliteration (foreign-script sources, e.g. Russia GRLS) ---
      cyrillic_transliteration:
        description: "Deterministic Russian Cyrillic -> Latin, then re-run the full ladder (composes with INN spelling + fuzzy). Recovers ~17% of GRLS names."
        annotations: {certainty: 0.75, rule_family: transliteration, predicate: skos:closeMatch}
      # --- family: fuzzy (lever #2; propose for curation, do not silently trust) ---
      fuzzy_edit1_unique:
        description: "Levenshtein edit-distance-1 match accepted only when it resolves to a single id in the top-priority vocab. Deterministic but approximate; written for curator review."
        annotations: {certainty: 0.60, rule_family: fuzzy, predicate: skos:closeMatch}
      # --- family: translation (lever #3; for genuinely foreign-language names) ---
      translation_dictionary:
        description: "Curated per-language term dictionary substitution (deterministic)."
        annotations: {certainty: 0.85, rule_family: translation, predicate: skos:closeMatch}
      translation_llm:
        description: "LLM translation of a non-English name to English (deferred; non-deterministic; review-only)."
        annotations: {certainty: 0.50, rule_family: translation, predicate: skos:closeMatch}
      deepl_translation:
        description: "DeepL machine translation of a non-English source name to English (via the babelon translator service; China zh, Russia ru). Recorded as a Babelon row keyed by the mention's MEDICNE id; the English translation_value is then handed to the grounder. Network-derived but cached in the git-tracked Babelon table (deterministic replay)."
        annotations: {certainty: 0.85, rule_family: translation, predicate: skos:closeMatch}
      # --- family: substance_resolver (product/formulation -> ingredient via an external substance vocab) ---
      rxnorm_resolve:
        description: "RxNav approximate-match resolves a product/formulation string to its ingredient INN, re-grounded to CHEBI/DRON. Network-derived, cached, curator-reviewable proposal written into the store (not run at resolve time)."
        annotations: {certainty: 0.70, rule_family: substance_resolver, predicate: skos:closeMatch}
  NormalizationQualityEnum:
    description: How the initial ID maps to the canonical target ID.
    permissible_values:
      curated:
        description: Manual assertion in the normalization SSSOM store.
      asserted_exact:
        description: Target namespace asserts an exact/db-xref mapping to normalized_id.
      deprecated_replacement:
        description: original_id obsolete, replaced_by normalized_id in the target namespace.
      identity:
        description: >-
          No target-namespace-supported normalization was needed; normalized_id equals
          original_id. The step is still emitted (invariant I-12) so a reader can tell
          "no-op" from "not recorded". Was named `none` before 2026-08-09.
  TranslatorExpertiseEnum:
    description: Babelon translator expertise (who/what produced the translation).
    permissible_values:
      ALGORITHM:
        description: Machine translation (e.g. DeepL).
      LAYPERSON:
        description: Non-expert human translator.
      DOMAIN_STUDENT:
        description: Trainee in the domain.
      DOMAIN_EXPERT:
        description: Subject-matter expert.
      PROFESSIONAL_TRANSLATOR:
        description: Professional human translator.
      TECHNICAL_SPECIALIST:
        description: Technical/terminology specialist.

classes:
  ProvenanceAgent:
    description: >-
      Who or what performed a step. Vendored fresh (distinct from MeDIC's evidence.Agent,
      which has a different {curator_id, curator_type, name} shape). Always inlined.

      `agent_version` pins the exact agent that ran — for an LLM this is the dated model id
      (e.g. claude-haiku-4-5-20251001), which is the single most important thing to record:
      model upgrades silently change extraction output (FAILURE_MODES 13.1), and without the
      pin a re-run is not comparable to the run that produced the record.
    slots: [agent_id, agent_type, agent_name, agent_version]
  SectionWarrant:
    description: >-
      A declaration that one source section asserts a relation **by construction** — not because
      of any cue phrase in the text, but because of where the text came from.

      Consulted when no phrase-level trigger is found. A warrant carrying a `section_code` is
      checked before the bare-`source` warrant, and only licenses the relation it names: an
      indication warrant must never license a contraindication.
    attributes:
      source:
        required: true
        description: The record's source (e.g. DAILYMED, EMA, PMDA, CDSCO). Matched case-insensitively.
      section_code:
        description: >-
          Section within the source document (e.g. LOINC:34067-9). Omit for a source whose whole
          extracted field is single-purpose.
      relationship:
        required: true
        description: The relation this section is warranted to assert (INDICATION, CONTRAINDICATION).
      description:
        required: true
        description: Why this section warrants that relation by construction.
  SectionWarrantSet:
    tree_root: true
    description: The contents of conf/section_warrants.yaml.
    attributes:
      warrants:
        range: SectionWarrant
        multivalued: true
        inlined_as_list: true
        required: true
  ConfidencePriorDefault:
    description: >-
      A family-level default used to **mint** a prior the first time an unseen producer runs.

      A tool or model version bump must not silently inherit the old prior, but it must also not
      break the build: instead the first use of an unseen producer mints a record from its
      family default, writes it to conf/confidence_priors.yaml, and proceeds. A human then sees
      it in the diff and can calibrate or override it. The family value is deliberately
      **version-independent** — a Haiku is a Haiku.
    attributes:
      family:
        required: true
        description: Family name, recorded on every prior minted from it (e.g. HAIKU, DEEPL).
      applies_to:
        range: PriorScope
        required: true
        description: Whether this default matches a versioned model or a tool.
      name_matches:
        required: true
        description: >-
          Case-insensitive substring matched against the producer's name (the agent_name for a
          model, the tool name for a tool). Must match exactly one default, or the load raises.
      value:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: The confidence minted for any producer in this family, at any version.
      rationale:
        required: true
        description: Why this family carries this value.
  ConfidencePrior:
    description: >-
      One calibrated fallback confidence, for a step that produces no measured score.

      A prior is only valid for the exact thing that produced it, so each record names either a
      versioned **model** (`agent_name` + `agent_version`) or a **tool** (`tool` +
      `tool_version`) — exactly one of the two, never both and never neither. A model upgrade
      silently changes output (FAILURE_MODES 13.1), so a prior calibrated on one model says
      nothing about the next; the loader raises on an unknown key rather than falling back.
    slots: [category, method]
    attributes:
      agent_name:
        description: >-
          Provider-qualified dated model id (e.g. anthropic/claude-haiku-4-5-20251001). Set,
          with agent_version, for steps run by a versioned model.
      agent_version:
        description: The dated model id. Required whenever agent_name is set.
      tool:
        description: >-
          Tool name (e.g. babelon, medic-lexical-grounder). Set, with tool_version, for every
          step not run by a versioned model — including DeepL, which publishes no engine
          version, so the babelon release that called it is what is knowable.
      tool_version:
        description: The tool's version. Required whenever tool is set.
      value:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: The assumed confidence. Every step using it is stamped basis PRIOR.
      calibrated:
        range: boolean
        required: true
        description: >-
          Whether this value was measured against a reviewed sample. `false` means it is a
          judgement call — still honest, because the step records it as PRIOR, but not evidence.
      auto_generated:
        range: boolean
        description: >-
          True when the record was minted from a family default on first use rather than written
          by a human. Auto-minted records are never overwritten by a later run, so a human edit
          always wins; set this to false when you calibrate one by hand.
      family:
        description: The ConfidencePriorDefault.family this record was minted from, if any.
      rationale:
        required: true
        description: Why this value; for a calibrated prior, against what sample.
  ConfidencePriorSet:
    tree_root: true
    description: The contents of conf/confidence_priors.yaml.
    attributes:
      defaults:
        range: ConfidencePriorDefault
        multivalued: true
        inlined_as_list: true
        required: true
      priors:
        range: ConfidencePrior
        multivalued: true
        inlined_as_list: true
        required: true
  CoMention:
    description: >-
      Another entity the extractor found in the same span as this step's output_value.
      Informational only: the chain stays strictly one-in-one-out (I-8), and co_mentions answers
      the separate question "was this string the only candidate, or one of five?". The
      mention_id makes the sibling records joinable without re-running the extractor.
    slots: [value, entity_type, mention_id, char_start, char_end]
  ConfidenceBreakdown:
    description: >-
      An assertion's confidence, decomposed. All four components are required (I-11): a partial
      score is not comparable across records, and a missing component previously defaulted to
      "no contribution", which let an unreviewed machine translation cost nothing.

      These are DATA-QUALITY numbers — how sure we are the entities and relation were read
      correctly — never evidence strength about the claim. Mapping `overall` onto an evidence
      score would convert "unsure of the identifier" into "weak evidence for the treatment";
      see docs/sepio-sieve-alignment.md §3.
    attributes:
      subject:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: Confidence that the subject (drug) was resolved to the right entity.
      object:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: Confidence that the object (disease) was resolved to the right entity.
      relationship:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: Confidence that the source text asserts this relation between them.
      overall:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: The product of subject x object x relationship.
      basis:
        range: ConfidenceBasis
        required: true
        description: The weakest basis among the steps feeding this breakdown.
  PairConfidence:
    description: >-
      A drug-disease pair's aggregate confidence across its source assertions, by noisy-OR
      (1 - prod(1 - c_i)) over SOURCES. Corroboration RAISES confidence, the opposite
      direction from a resolution chain, where each step is another chance to have linked
      the wrong entity.

      The aggregate runs over sources, not assertions, because noisy-OR's premise is that
      its inputs fail independently and two documents from one regulator do not: a generic
      label and its twenty relabellings carry the same sentence, read by the same extractor
      against the same index. Each source therefore contributes once, at its
      best-resolved attestation. Two regulators at 0.7 give 0.91; one regulator saying it
      twenty-four times gives 0.7.
    attributes:
      overall:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: >-
          The noisy-OR aggregate over the pair's distinct sources, each taken at its
          best-resolved assertion.
      method:
        description: How the aggregate was computed. Currently always NOISY_OR.
      n_assertions:
        range: integer
        description: How many source assertions the pair carries.
      n_sources:
        range: integer
        description: >-
          How many distinct sources the aggregate rests on — the number of terms actually
          fed to the noisy-OR. Recorded because `overall` alone cannot distinguish two
          regulators agreeing from one regulator with a well-populated label.
  TextSpan:
    description: >-
      A chunk of source text a Mention was extracted from — a paragraph, sentence, or a
      structured cell. Multivalued on an assertion because one indication is assembled from
      several disconnected spans (a header, the indication sentence, a Limitations-of-Use
      sentence).
    slots: [text, role, document, section_code]
    slot_usage:
      role: {required: true}
  TransformationStep:
    abstract: true
    description: >-
      One named step on the path from a verbatim source value to a canonical id. Records
      both its incoming (input_value) and outgoing (output_value) value — schema-level
      enforcement of invariant I-8. Subclasses narrow quality/flags/applied_rules.
    slots: [category, input_value, output_value, output_label, method, tool, tool_version,
            agent, confidence, confidence_basis, status, applied_rules, quality, flags, comment]
    slot_usage:
      confidence: {required: true, minimum_value: 0.0, maximum_value: 1.0}
      confidence_basis: {required: true}
  ExtractionStep:
    is_a: TransformationStep
    description: >-
      Source text (or structured cell) -> the entity mention string. This step is about
      **recognising the entity only** (named-entity recognition for free text; a verbatim
      field read for structured sources). It deliberately says nothing about what claim the
      mention participates in — that is the Assertion's job. `confidence` is how sure we are
      that this string really denotes an entity occurring in `input_value`.

      `span_role` and `span_index` name which span was read, making
      `pipeline[0].input_value == spans[span_index].text` checkable rather than assumed (I-8b).
    slots: [span_role, span_index, char_start, char_end, mention_index, mention_total,
            co_mentions]
    slot_usage:
      quality: {range: ExtractionQuality}
      flags: {range: ExtractionFlag}
  TranslationStep:
    is_a: TransformationStep
    description: Foreign string -> English string.
    slots: [source_language, target_language, predicate_id, translator_expertise]
    slot_usage:
      quality: {range: TranslationPrecision}
      flags: {range: TranslationFlag}
  GroundingStep:
    is_a: TransformationStep
    description: String -> initial ontology id.
    slots: [match_field, predicate_id, source_vocabulary, components]
    slot_usage:
      quality: {range: GroundingQualityEnum}
      flags: {range: GroundingFlag}
      applied_rules: {range: PreprocessingRuleEnum}
  NormalizationStep:
    is_a: TransformationStep
    description: Initial id -> canonical target id.
    slots: [target_namespace, mapping_justification]
    slot_usage:
      quality: {range: NormalizationQualityEnum}
      flags: {range: NormalizationFlag}
  Resolution:
    description: >-
      The transformation container: the aggregate input_value -> output_value of the whole
      chain, an aggregate confidence (the product of the step confidences), and the ordered
      pipeline of steps. Chaining invariant: input_value == pipeline[0].input_value,
      output_value == pipeline[-1].output_value (== the Mention's resolved_id), and each
      step's output_value equals the next step's input_value.
    slots: [input_value, output_value, confidence, pipeline]
  Assertion:
    description: >-
      How a **claim** (a relation between entities) was derived from a source — the
      relation-extraction counterpart to a Mention's entity recognition. Kept separate on
      purpose: a Mention answers "what entity is this string?", an Assertion answers "what
      is the source claiming about it?". The relation itself is named by the record that
      owns the Assertion (e.g. IndicationAssociation.relationship_type), not repeated here.

      `confidence` is how well the source text supports the claim; `flags` record
      relation-level failure modes (negated, over-extracted, wrong section, wrong pairing).
    slots: [input_value, method, tool, tool_version, agent, relationship, confidence,
            trigger_span, trigger_cue, span_index, negation_scope, section_warrant, status,
            negation_cue, flags, comment]
    slot_usage:
      input_value:
        required: false
        description: The supporting quote from the source that the claim was read from.
      confidence: {range: ConfidenceBreakdown, required: true}
      flags: {range: AssertionFlag}
  Mention:
    description: >-
      A resolved source mention: its verbatim literal + stable id, the source spans it was
      drawn from, its resolution container (the ordered pipeline), and the resolved
      canonical id/label. Read original_literal + resolved_id for the quick answer, or walk
      resolution.pipeline for the full audit (via each step's flags).
    slots: [id, original_literal, entity_type, source_language, mention_source,
            source_spans, resolution, resolved_id, resolved_label]

slots:
  # --- ProvenanceAgent ---
  agent_id:
    range: uriorcurie
    description: Identifier of the agent (e.g. wikidata:Q116709136 for DeepL). Optional.
  agent_type:
    range: AgentTypeEnum
    description: HUMAN or AI_AGENT.
  agent_name:
    description: Human-readable agent name.
  agent_version:
    description: >-
      Version of the agent that ran the step. For an LLM this is the dated model id
      (e.g. "claude-haiku-4-5-20251001"); for a service, its released version. Empty when
      the agent publishes no version (e.g. a hosted API with no version surface).
  # --- TextSpan ---
  text:
    required: true
    description: The source text chunk (paragraph, sentence, or structured cell).
  role:
    range: TextSpanRoleEnum
    description: What role this chunk of text plays in its document.
  document:
    range: uriorcurie
    description: >-
      Document the span came from (e.g. DailyMed:<setid>). Supersedes source_reference. Equal
      to the owning assertion's `document` — enforced by invariant I-10.
  section_code:
    description: Section within that document (e.g. LOINC:34067-9, a column name).
  # --- CoMention (added 2026-08-09) ---
  value:
    required: true
    description: The verbatim text of a co-mention.
  mention_id:
    range: uriorcurie
    description: The MEDICNE id minted for a co-mention, so sibling records are joinable.
  char_start:
    range: integer
    description: Start offset of the value within the span text.
  char_end:
    range: integer
    description: End offset (exclusive) of the value within the span text.
  # --- ExtractionStep span anchoring (added 2026-08-09) ---
  span_role:
    range: TextSpanRoleEnum
    description: Role of the span this step read.
  span_index:
    range: integer
    description: Index into the owning assertion's `spans` list of the span this step read.
  mention_index:
    range: integer
    description: >-
      1-based position of this mention among same-entity_type mentions found in the span.
  mention_total:
    range: integer
    description: How many same-entity_type mentions the extractor found in the span.
  co_mentions:
    range: CoMention
    multivalued: true
    inlined_as_list: true
    description: >-
      Other entities found in the same span. Informational; does not affect the chain, which
      stays strictly one-in-one-out.
  # --- Assertion negation scoping (added 2026-08-09) ---
  negation_scope:
    range: integer
    multivalued: true
    description: >-
      Indices of the spans negation was evaluated against. Excludes LIMITATION_STATEMENT spans,
      which restrict a claim rather than negating it (design spec §4.3).
  # --- TransformationStep (shared) ---
  confidence_basis:
    range: ConfidenceBasis
    description: Where this step's confidence came from — measured, deterministic, or assumed.
  category:
    range: TransformationCategory
    required: true
    description: Discriminator so a heterogeneous steps[] list is readable.
  input_value:
    required: true
    description: I-8 incoming value (verbatim; never mutated, I-7).
  output_value:
    description: I-8 outgoing value ('' if the step failed).
  output_label:
    description: Human-readable label of output_value (e.g. the grounded/normalized term label).
  method:
    range: TransformationMethod
    required: true
    description: How the step was performed.
  tool:
    description: Tool name, e.g. "DeepL", "medic-lexical-grounder".
  tool_version:
    description: Version of the tool that ran this step, e.g. "1", "1.3".
  agent:
    range: ProvenanceAgent
    inlined: true
    description: Who/what ran the step.
  confidence:
    range: float
    description: >-
      0-1 step confidence. The bounds live on `TransformationStep.slot_usage` rather than
      here because this slot is deliberately reused with three non-numeric ranges —
      `ConfidenceEnum` (Evidence), `ConfidenceBreakdown` (SourceAssertion) and
      `PairConfidence` (IndicationAssociation). A `minimum_value` here is inherited by all
      of them, and gen-pydantic emits it as a `ge` constraint applied to an object, which
      makes the generated model unable to validate any product carrying an object-ranged
      confidence. Keep the bounds attached to the float usage only.
  status:
    range: StepStatus
    description: Curation lifecycle state.
  applied_rules:
    multivalued: true
    description: Named transforms applied (subclasses narrow the range).
  quality:
    description: Stage outcome (subclasses narrow to their enum).
  flags:
    multivalued: true
    description: Detected failure-mode signals (subclasses narrow).
  comment:
    description: Free-text note.
  # --- Assertion (relation-level claim provenance) ---
  assertion:
    range: Assertion
    inlined: true
    description: How the claim (the asserted relation) was derived from the source.
  relationship:
    description: >-
      The relation this assertion establishes, restated here so the assertion is readable
      standalone (deliberately redundant with the owning record's relationship_type).
  trigger_span:
    description: >-
      The exact substring of `input_value` that establishes the relation (e.g. "is indicated
      for the treatment of"). An **extractive** rationale, not a generated explanation: it is
      verified to occur verbatim in the source text, so it can be checked rather than
      believed. Empty when no trigger could be located and verified.
  trigger_cue:
    range: TriggerCueEnum
    description: The kind of textual cue the trigger_span represents.
  section_warrant:
    description: >-
      When the relation rests on **structural provenance** rather than a phrase (cue
      `section_header`), the source section that warrants it — e.g.
      "DAILYMED/LOINC:34067-9" for the FDA SPL Indications & Usage section, which by
      construction contains only indications. Curated per source in
      `conf/section_warrants.yaml`, never inferred.
  negation_cue:
    description: The negation cue found in the source, if the claim was stated negatively.
  # --- TranslationStep extras ---
  source_language:
    description: ISO code of the source value (e.g. zh, ru).
  target_language:
    description: ISO code of the translation (e.g. en-us).
  predicate_id:
    range: uriorcurie
    description: Mapping predicate for this step (e.g. skos:exactMatch, rdfs:label).
  translator_expertise:
    range: TranslatorExpertiseEnum
    description: Who/what produced the translation.
  # --- GroundingStep extras ---
  grounded_label:
    description: (legacy grounding.yaml Grounding class) Canonical label of the grounded id.
  match_field:
    description: Which vocabulary field matched (label / synonym).
  source_vocabulary:
    description: Vocabulary the initial id came from (CHEBI, MONDO, ...).
  components:
    range: uriorcurie
    multivalued: true
    description: Component ids when the string is a combination.
  # --- NormalizationStep extras ---
  normalized_label:
    description: (legacy grounding.yaml Normalization class) Canonical label of the normalized id.
  target_namespace:
    description: Canonical target namespace (MONDO, CHEBI).
  mapping_justification:
    description: Why the normalization mapping holds (e.g. asserted xref).
  # --- Resolution (the container) ---
  resolution:
    range: Resolution
    inlined: true
    description: The transformation container (aggregate input/output/confidence + the pipeline).
  pipeline:
    range: TransformationStep
    multivalued: true
    inlined_as_list: true
    description: "Ordered steps: ExtractionStep? -> TranslationStep? -> GroundingStep -> NormalizationStep?"
  # --- Mention ---
  id:
    range: uriorcurie
    required: true
    description: >-
      Stable mention id (MeDIC: MEDICNE:<uuid5>) — the SSSOM subject and cross-source dedup
      key, NOT a cross-record join pointer.
  original_literal:
    required: true
    description: Verbatim source string (I-7).
  entity_type:
    description: e.g. drug / disease.
  mention_source:
    description: Originating source name (e.g. CDE, DailyMed, ORANGEBOOK).
  source_spans:
    range: TextSpan
    multivalued: true
    inlined_as_list: true
    description: Source text this mention was drawn from (the pipeline's input_value quotes it).
  resolved_id:
    range: uriorcurie
    description: Final canonical id (== resolution.output_value).
  resolved_label:
    description: Label of resolved_id.
