# Closed vocabulary for the formulation_strip rule (family: formulation, rule formulation_strip).
# Source product strings (esp. India CDSCO) carry dose + dosage-form + release + pharmacopoeia
# noise around the active ingredient. These closed lists drive a deterministic stripper that
# removes that noise; the cleaned residue re-enters the full match ladder (salt/fuzzy/combination).
# Deterministic and hand-editable; extend as the unresolved formulation tail is triaged.
#
# Guards live in code (src/medic/grounding/lexical/preprocess.py):
#   - strength/unit removal is numeric-anchored, so meaningful token-internal digits
#     (B12, omega-3, vitamin d3, 2-deoxy-d-glucose) are preserved;
#   - form/release/pharmacopoeia words are matched only on whole-word boundaries;
#   - the rule never returns an empty or sub-3-char residue (would be a false strip).

# Dosage forms and delivery formats (longest-first matching is applied in code).
