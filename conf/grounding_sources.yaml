# Sources for building the offline lexical index.
# OBO vocabs are downloaded from their PURLs into cache/ontologies/.
# Licensed/non-OBO vocabs use local files (see background/ and the report).
#
# `ontologies` pins the release of every OBO vocab the index is built from. The unversioned
# PURL (http://purl.obolibrary.org/obo/<ont>.json) resolves to whatever is current on the
# day it is fetched, so two builds a month apart ground against different term sets and
# nothing records which (#94). `just download-grounding-ontologies` reads these pins, the
# index build stamps them into the index's `meta` table, and the KGX content metadata
# reports them. Bump a pin deliberately, in its own commit, and rebuild the index.
#
# URL patterns: mondo, hp and dron serve versioned OBO Graph JSON from the release PURL
# (http://purl.obolibrary.org/obo/<ont>/releases/<date>/<ont>.json). ChEBI does not use
# dated releases; its archive PURL is http://purl.obolibrary.org/obo/chebi/<rel>/chebi.json.
#
# These are the releases every build to date actually grounded against, read back from the
# `meta.version` of the files in cache/ontologies/ — *not* the newest pinnable release. A
# pin that names a release we did not build from would record a reproducibility claim that
# is false, which is worse than no pin at all; `build_index` now checks the file against it
# and refuses a mismatch. Bumping these is therefore a deliberate re-download and a full
# rebuild (every grounded id and the 4.7% error rate move with it), in its own commit.
ontologies:
  mondo:
    version: "2026-07-06"
    url: http://purl.obolibrary.org/obo/mondo/releases/2026-07-06/mondo.json
  hp:
    version: "2026-06-23"
    url: http://purl.obolibrary.org/obo/hp/releases/2026-06-23/hp.json
  chebi:
    version: "253"
    url: http://purl.obolibrary.org/obo/chebi/253/chebi.json
  dron:
    version: "2026-06-04"
    url: http://purl.obolibrary.org/obo/dron/releases/2026-06-04/dron.json

diseases:
  - {prefix: MONDO, loader: obo_json, path: cache/ontologies/mondo.json, ontology: mondo}
  - {prefix: HP, loader: obo_json, path: cache/ontologies/hp.json, ontology: hp}
  - {prefix: UMLS, loader: umls, path: background/umls-2021AA-mrconso.zip, member: MRCONSO.RRF}
  # ICD10CM dropped: redundant with UMLS (which carries ICD10CM as a source SAB); +64 groundings only.
drugs:
  - {prefix: CHEBI, loader: obo_json, path: cache/ontologies/chebi.json, ontology: chebi}
  - {prefix: DRON, loader: obo_json, path: cache/ontologies/dron.json, ontology: dron}
  # RxNorm ingredients, from a committed table (3 columns, 0.7MB) so the index is
  # reproducible from a checkout. Regenerate against a newer OMOP/ATHENA release with
  # scripts/build_rxnorm_table.py; only that script needs the 1GB dump. The table carries
  # RxNorm content only — the bundle's SNOMED/MedDRA is excluded at extraction time, see
  # LICENSING.md. No `ontology:` pin: the file *is* the pin, versioned by the checkout.
  - {prefix: RXCUI, loader: omop_rxnorm, path: data/vocab/rxnorm_ingredients.tsv}
  # PR dropped: +15 groundings only (drug names are chemicals, not proteins).
