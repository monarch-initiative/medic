# Which build outputs may be published as release assets, and on whose terms.
#
# `just gh-release` used to glob `exports/*.{csv,xlsx,jsonl,tsv}` and ship whatever it
# found. That makes publication the default: the KGX export added 57 MB of new assets —
# including 4.6 MB of verbatim EMA/PMDA/DailyMed label text — and nothing asked whether
# they could lawfully ship. Here an unlisted file is REFUSED, so a new export forces a
# decision rather than inheriting one.
#
# `sources` on each asset drives the attribution notice generated for the release
# (medic.release_assets), so the notice can never drift out of sync with what is
# actually being published. Terms per source are in LICENSING.md.

notice: |
  Contains data from {sources}. Data has been edited: source records were parsed,
  translated, normalised, and mapped to ontology identifiers by the MeDIC pipeline.
  None of these bodies endorses this derived work.

# The licence position, stated once and flowed into every artifact that can carry it
# (exports/NOTICE.md, the KGX metadata, the SSSOM headers, the release body).
license:
  # What MeDIC grants over a released file *as a whole*. CC BY rather than CC0 because
  # every shipped file mixes MeDIC's own assertions with verbatim source strings, and EMA
  # and PMDA both require attribution: declaring CC0 would tell a consumer attribution is
  # optional, which is exactly the misreading LICENSING.md warns against.
  medic_contribution: https://creativecommons.org/licenses/by/4.0/

  # MeDIC's own contribution — the assertion that a source string resolves to a given
  # CURIE, by a given method, at a given confidence — is still offered without conditions.
  # The file-level CC BY comes from the third-party content beside it, not from MeDIC
  # wanting credit for the mappings.
  medic_assertions_offered_as: https://creativecommons.org/publicdomain/zero/1.0/

  # The passthrough. This is the load-bearing sentence: processing does not launder terms.
  passthrough: >-
    MeDIC grants no rights over upstream source content. The original licence of each
    contributing source remains in force and must be respected; parsing, translation,
    normalisation and mapping to ontology identifiers do not alter it. Where terms
    conflict, the stricter governs.

  terms_url: https://github.com/monarch-initiative/medic/blob/main/LICENSING.md

# attribution:
#   required — a licence condition; the source must be named when the data is redistributed
#   courtesy — public-domain or equivalent; naming it is good practice, not an obligation
#   none     — no declared licence upstream; see LICENSING.md for the redistribution reading
sources:
  dailymed:
    name: the U.S. National Library of Medicine (DailyMed)
    attribution: courtesy
  orangebook:
    name: the U.S. Food and Drug Administration (Orange Book)
    attribution: courtesy
  purplebook:
    name: the U.S. Food and Drug Administration (Purple Book)
    attribution: courtesy
  cureid:
    name: FDA/NCATS CURE-ID
    attribution: courtesy
  ema:
    name: the European Medicines Agency (© EMA)
    attribution: required
  pmda:
    name: the Pharmaceuticals and Medical Devices Agency of Japan (PMDA, https://www.pmda.go.jp)
    attribution: required
  cdsco:
    name: the Central Drugs Standard Control Organisation of India (CDSCO)
    attribution: required          # unverified upstream; assumed required (LICENSING.md)
  grls:
    name: the Russian State Register of Medicines (GRLS)
    attribution: none
  cde:
    name: the China NMPA Center for Drug Evaluation
    attribution: none
  everycure:
    name: EveryCure (drug-list and disease-list, CC BY 4.0)
    attribution: required
  mondo:
    name: the Mondo Disease Ontology (CC BY 4.0)
    attribution: required
  pubmed:
    name: PubMed
    attribution: courtesy

assets:
  # ---- products ----------------------------------------------------------------
  - path: products/drug_list.yaml
    sources: [orangebook, purplebook, ema, pmda, grls, cdsco, cde, everycure]
    ship: true

  - path: products/disease_list.yaml
    sources: [mondo, everycure]
    ship: true
    note: >-
      Carries 1,443 MedDRA identifiers as crossreferences, inherited from Mondo. Bare
      identifiers only — no MedDRA dictionary terms — so the MSSO restriction on term text
      does not attach. See LICENSING.md.

  - path: products/indication_list.yaml
    sources: [dailymed, ema, pmda, cdsco]
    ship: true
    note: >-
      Contains ~45 MB of verbatim indication text across three fields, measured 2026-08-21.
      An earlier version of this note said "~4.9 MB ... each excerpt capped at 500 characters
      (PMDA 988)". Only ONE of the three fields is capped, and the volume was understated by
      roughly an order of magnitude — so the redistribution decision was signed off against a
      description of the data that was wrong. Restated per source and per field:
      `evidence.snippet` IS capped (DailyMed/EMA/India 500, PMDA 988). `span.text` and each
      resolution step's `input_value` are NOT capped and carry the bulk: DailyMed text reaches
      14,474 characters (10.0 MB over 9,124 spans) and input_value 9,486 (20.2 MB); EMA reaches
      8,249 in both (3.1 MB and 7.7 MB) — an 8,249-character EMA span is an entire SmPC
      "Therapeutic indications" section reproduced verbatim, 1,714 of them over 500 characters.
      By source: DailyMed ~32.7 MB (US government public domain, so volume is a size question,
      not a rights one), EMA ~12.0 MB and PMDA ~3.1 MB (both require attribution), India
      ~0.2 MB (terms unverified). Whether whole-section reproduction is acceptable for EMA and
      PMDA is a live decision (#51); this note now describes what actually ships so that
      decision is made against the real thing.

  - path: products/contraindication_list.yaml
    sources: [dailymed]
    ship: true
    note: >-
      Contains ~13.3 MB of verbatim contraindication text (measured 2026-08-21), DailyMed only.
      Same field shape as indication_list: `evidence.snippet` is capped at 500 characters,
      `span.text` and step `input_value` are not — both reach 14,011 characters, an entire
      CONTRAINDICATIONS section reproduced verbatim. DailyMed SPLs are US government public
      domain, so this is a size question rather than a rights one, and it is recorded here
      because an asset shipping this much verbatim text should not be the one entry in the
      manifest that says nothing about it.

  - path: products/research_list.yaml
    # `cureid` was declared here but CURE-ID has never been ingested (#43): all 9 records in
    # this product are PubMed-derived, and nothing in it carries a CUREID source. Crediting a
    # source that contributed nothing is an accuracy defect in the very document that carries
    # the attribution obligations, so it is removed until the ingest actually runs.
    sources: [pubmed]
    ship: true

  # products/adverse_event_list.yaml was listed here as a permanently HELD asset. It is gone
  # in v2.0.0: nothing MedDRA-derived is built, so the product was an empty stub
  # (`associations: []`) and the entry described an asset that never had content. Holding a
  # placeholder is not the same as deciding the licence question, and an entry that only ever
  # says "held" reads like the question has been handled when it has not. Whether PVLens and
  # FAERS can be ingested at all under the ICH/MSSO terms is tracked as its own issue; when
  # that is answered, this entry comes back with a real decision attached.
  - path: exports/drug_list_flexible.csv
    sources: [orangebook, purplebook, ema, pmda, grls, cdsco, cde, everycure]
    ship: true

  - path: exports/drug_list_stringent.csv
    sources: [orangebook, purplebook, ema, pmda, everycure]
    ship: true
    note: Excludes the approved_india and approved_russia columns by construction.

  - path: exports/orangebook.xlsx
    sources: [orangebook]
    ship: true

  - path: exports/purplebook.xlsx
    sources: [purplebook]
    ship: true

  - path: exports/ema.xlsx
    sources: [ema]
    ship: true

  - path: exports/pmda.xlsx
    sources: [pmda]
    ship: true

  - path: exports/russia.csv
    sources: [grls]
    ship: true
    note: >-
      Derived record table, not the GRLS source archive (which is never redistributed).
      5,885 rows of DeepL-translated English drug name + ChEBI id + approval date. The
      Cyrillic originals and the GRLS registration numbers are in kb/ but are NOT exported.

  - path: exports/india.csv
    sources: [cdsco]
    ship: true
    note: >-
      112 rows. Unlike russia.csv this DOES carry verbatim source content: the CDSCO
      formulation string, plus short indication phrases on 101 of 112 rows. CDSCO terms are
      undeclared upstream; LICENSING.md assumes attribution is required. Revisit before any
      commercial redistribution.

  # ---- exports: graph and mappings ---------------------------------------------
  - path: exports/medic_nodes.jsonl
    sources: [orangebook, purplebook, ema, pmda, grls, cdsco, cde, everycure, mondo]
    ship: true

  - path: exports/medic_edges.jsonl
    sources: [dailymed, ema, pmda, cdsco, pubmed]
    ship: true
    note: >-
      Contains ~12.2 MB of verbatim label text in supporting_text, measured 2026-08-21. These
      are the same excerpts as products/indication_list.yaml but are NOT "capped identically",
      as this note previously claimed: supporting_text is capped at 2,000 characters here
      against 500 for the product's snippet field, and 2,468 edges carry
      medic_supporting_text_truncated to say so. By source: DailyMed 9.1 MB over 8,859 edges
      (max 2,000), EMA 2.5 MB over 3,054 (max 2,000), PMDA 0.6 MB (max 988, its natural
      length), India 0.03 MB. EMA and PMDA both require attribution. If a cap is ever added to
      the product's span.text, note that object_location_in_text offsets index into these
      strings and must be recomputed with it.

  - path: exports/medic_kgx_metadata.yaml
    sources: []
    medic_authored: true
    ship: true
    note: Counts and licensing metadata for the KGX graph; carries the attribution notice.

  - path: exports/NOTICE.md
    sources: []
    medic_authored: true
    ship: true
    note: >-
      Generated. The general licensing notice for the whole release — attribution, the
      passthrough statement, and the per-asset source table. Every release asset is covered
      here; the per-format notices (KGX metadata, SSSOM header) are convenience copies for
      formats that can carry one.

  - path: exports/infores_medic.yaml
    sources: []
    medic_authored: true
    ship: true
    note: Proposed Translator information-resource entry. MeDIC-authored.

  - path: exports/medic_drug_mappings.sssom.tsv
    sources: [orangebook, purplebook, ema, pmda, grls, cdsco, cde, everycure]
    ship: true
    note: >-
      Mapping assertions are CC0 (MeDIC's own contribution), but subject_label reproduces
      verbatim source strings, which stay under source terms. The file header states both.

  - path: exports/medic_statements.tsv
    sources: [dailymed, ema, pmda, cdsco, grls, cde, pubmed]
    ship: true
    note: >-
      No in-band licence header: docs/reliability.md documents reading this file with
      csv.DictReader, which a leading '#' comment block would break. Attribution travels
      with the release NOTICE instead.

  - path: exports/medic_reliable.tsv
    sources: [dailymed, ema, pmda, cdsco, grls, cde, pubmed]
    ship: true
    note: Same as medic_statements.tsv.
