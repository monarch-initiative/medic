notes: >-
  The helper grounds the ACE-inhibitor ingredient to trandolaprilat (CHEBI:141521), the SPL active
  moiety; the label speaks of trandolapril, the prodrug. Not claimed: "not indicated for the
  initial therapy of hypertension"; the captopril agranulocytosis paragraph in Indications (a
  warning); hypersensitivity to verapamil (own ingredient); item 6 "Patients taking flibanserin",
  "contraindicated in combination with a neprilysin inhibitor (e.g., sacubitril)" and the 36-hour
  sacubitril/valsartan switching rule (pure drug interactions with no condition, out of scope).
