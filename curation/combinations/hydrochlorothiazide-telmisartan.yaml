  document:
    setid: e80f232c-c1c4-4524-a0a5-d23ee0d1f3b7
    version: 11
    title: 'These highlights do not include all the information needed to use TELMISARTAN AND HYDROCHLOROTHIAZIDE
      TABLETS safely and effectively. See full prescribing information for TELMISARTAN AND HYDROCHLOROTHIAZIDE
      TABLETS. TELMISARTAN and HYDROCHLOROTHIAZIDE tablets, for oral use Initial U.S. Approval: 2000'
    url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=e80f232c-c1c4-4524-a0a5-d23ee0d1f3b7
  product_name: Telmisartan and Hydrochlorothiazide
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: hypertension
      term:
        id: HP:0000822
        label: Hypertension
      binding: EXACT
    quote: >-
      Telmisartan and hydrochlorothiazide tablets are indicated for the treatment of hypertension,
      to lower blood pressure.
    explanation: >-
      "are indicated for the treatment of hypertension" states treatment of hypertension; "to lower
      blood pressure" gives the means, not another condition.
    status: DRAFT
    notes: >-
      Product-level, unattributed. "may be used alone or in combination with other antihypertensive
      agents" makes co-therapy optional, so no in_combination_with. "not indicated for initial
      therapy for the treatment of hypertension" restricts this claim but produces none. HP
      Hypertension agrees with the grounding store; MONDO has no term labelled or exactly
      synonymous with "hypertension".
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: anuria
      term:
        id: HP:0100519
        label: Anuria
      binding: EXACT
    quote: >-
      In patients with anuria.
    explanation: >-
      Under "Telmisartan and hydrochlorothiazide tablets are contraindicated:", the item "In
      patients with anuria" states the anuria contraindication.
    status: DRAFT
    notes: Product-level, unattributed. The Highlights restate it ("Anuria (4)").
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: diabetes
      term:
        id: MONDO:0005015
        label: diabetes mellitus
      binding: EXACT
    quote: >-
      For co-administration with aliskiren in patients with diabetes
    when_coadministered_with:
    - text: aliskiren
      term:
        id: CHEBI:601027
        label: aliskiren
      binding: EXACT
    explanation: >-
      Under "are contraindicated:", the item "For co-administration with aliskiren in patients with
      diabetes" contraindicates the product in patients with diabetes when given with aliskiren,
      recorded as when_coadministered_with.
    status: DRAFT
    notes: >-
      Holds only with aliskiren co-administration. MONDO diabetes mellitus has the exact synonym
      "diabetes". Not attributed: the item speaks of the product, not of telmisartan. The
      Highlights restate it.
notes: >-
  Not claimed: the class-level cardiovascular-outcomes text after the indication (the label says
  there are no controlled trials demonstrating risk reduction with this product); "not indicated
  for initial therapy"; hypersensitivity to any component of this product / to telmisartan (own
  ingredients). The Highlights restate the indication and the contraindications. All claims are
  product-level: the label never assigns an indication or contraindication to telmisartan or
  hydrochlorothiazide.
