notes: >-
  Not claimed: "In the setting of coronary artery bypass graft (CABG) surgery" names a procedure,
  not a condition. Hypersensitivity to diclofenac sodium, misoprostol or any components is an
  allergy to the product's own ingredients. The "maternal and fetal harm" sentence and the
  anaphylaxis sentence state risks. The Indications sentence "For a list of factors that may
  increase the risk ..." is a cross-reference. No claim in the label names diclofenac or
  misoprostol as its cause in its own sentence, so none is attributed (see the pregnancy claim's
  notes). The Highlights copies restate the full-text claims.
