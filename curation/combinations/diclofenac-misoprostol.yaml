  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Pregnancy
      term_gap: >-
        searched MONDO "pregnancy"; HP "pregnancy", "pregnant", "pregnan"; PATO "pregnan": no term for
        pregnancy as a state (only pregnancy disorders, exposures and modifiers); the grounding
        store's UMLS:C0032961 is in no configured ontology
    quote: >-
      Diclofenac sodium and misoprostol delayed-Release tablets are contraindicated in the following
      patients: Pregnancy.
    explanation: >-
      The first item of "are contraindicated in the following patients:" is pregnancy.
    status: DRAFT
    notes: >-
      Unbound for lack of a term. Not attributed, though the next sentence points at misoprostol
      ("Use of misoprostol, a component of diclofenac sodium and misoprostol delayed-release
      tablets, during pregnancy can result in maternal and fetal harm"): that sentence is a risk
      statement of its own, outside the sentence that states the contraindication, so under the
      skill's same-sentence rule it does not attribute this claim. A reviewer may judge it a
      stated reason; uterine rupture, abortion, premature birth and birth defects there are risks,
      not contraindicated conditions.
  - relation: CONTRAINDICATED_IN
