  claims:
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: osteoarthritis or rheumatoid arthritis
      member: osteoarthritis
      term:
        id: MONDO:0005178
        label: osteoarthritis
      binding: EXACT
    age_range:
      min_years: 18
      text: adult patients
    quote: >-
      Diclofenac sodium and misoprostol delayed-release tablets are indicated for treatment of the
      signs and symptoms of osteoarthritis or rheumatoid arthritis in adult patients at high risk of
      developing NSAID-induced gastric and duodenal ulcers and their complications.
    explanation: >-
      "indicated for treatment of the signs and symptoms of osteoarthritis or rheumatoid
      arthritis" is symptomatic treatment, so AMELIORATES_CONDITION; this claim covers the member
      osteoarthritis; "in adult patients" gives the age.
    status: DRAFT
    notes: >-
      Product-level claim ("Diclofenac sodium and misoprostol delayed-release tablets are
      indicated"), unattributed. "at high risk of developing NSAID-induced gastric and duodenal
      ulcers and their complications" restricts the population to patients at ulcer risk; it is a
      risk criterion, not a disease the patients have, so it is not a disease_context, and the
      label states no ulcer-prevention indication of its own.
