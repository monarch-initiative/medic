notes: >-
  Not claimed: the Limitations of Use (type 1 diabetes mellitus); "Serious hypersensitivity
  reaction to canagliflozin or metformin HCl, such as anaphylaxis or angioedema" (own ingredients;
  the reactions describe it). The Highlights restate the indications and contraindications more
  briefly. The glycemic-control indication and the contraindications are the product's, so none
  is attributed.
  NOT YET CURATED: the canagliflozin-only indications under the list lead "Canagliflozin, when
  used as a component of INVOKAMET or INVOKAMET XR, is indicated in adults with type 2 diabetes
  mellitus to reduce the risk of:". The label assigns them to canagliflozin, but the validator
  cannot accept that attribution: the ingredient resolves to CHEBI:750399 "canagliflozin
  anhydrous" (activeMoiety CANAGLIFLOZIN ANHYDROUS), so the label's plain "Canagliflozin" never
  counts as naming it (the deciding blocker); in the full-text copy the subject also sits 41
  characters from "is" once the product name is blanked (the check allows 40; the shorter
  Highlights copy, without the comma, is at 40 but omits the MI/stroke items and the albuminuria
  threshold). Recording them unattributed would state them of the product,
  crediting metformin with cardiovascular and kidney outcomes the label gives to canagliflozin
  alone, so they are left out until the check accepts the attribution. Planned, each
  PREVENTATIVE_FOR_CONDITION, age_range adults, attributed to CHEBI:750399 by INGREDIENT_SUBJECT
  on that lead: (1) "nonfatal myocardial infarction" (MONDO:0005068 myocardial infarction, EXACT)
  and "nonfatal stroke" (MONDO:0005098 stroke disorder, EXACT), context "established
  cardiovascular disease" (MONDO:0004995 cardiovascular disorder); (2) "End-stage kidney disease
  (ESKD)" (MONDO:0004375 end stage renal failure, EXACT), "doubling of serum creatinine"
  (HP:0003259 Elevated circulating creatinine concentration, BROADER) and "hospitalization for
  heart failure" (MONDO:0005252 heart failure, BROADER), context "diabetic nephropathy with
  albuminuria greater than 300 mg/day" (MONDO:0005016 diabetic kidney disease, BROADER).
  "cardiovascular death" in both items is an outcome, not a condition (as "death" in the
  aspirin/omeprazole file), so it would not be claimed.
