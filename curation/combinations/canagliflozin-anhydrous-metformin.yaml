    explanation: >-
      "indicated ... to improve glycemic control in adults and pediatric patients aged 10 years and
      older with type 2 diabetes mellitus" states treatment of type 2 diabetes mellitus; "aged 10
      years and older" gives the age bound.
    status: DRAFT
    notes: >-
