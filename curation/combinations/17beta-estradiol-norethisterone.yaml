  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: Moderate to Severe Vasomotor Symptoms
      term_gap: >-
        searched MONDO "vasomotor", "menopaus", "climacteric", "hot flash"; HP "vasomotor", "hot
        flash", "hot flush", "menopaus": no term for menopausal vasomotor symptoms; HP:0031217 Hot
        flashes names one vasomotor symptom only (night sweats are another), so binding it would say
        less than the label
    quote: >-
      indicated in a woman with a uterus for: Treatment of Moderate to Severe Vasomotor Symptoms due
      to Menopause
    life_stage:
      text: Menopause
      term_gap: >-
        searched HsapDv "menopaus", "postmenopaus", "adult"; MONDO and HP "menopaus": no menopause
        life-stage term (HP:0008209 Early menopause and MONDO:0001119 premature menopause are
        disorders; adult stage would drop the restriction)
    sex:
      text: woman
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    explanation: >-
      "indicated in a woman with a uterus for: Treatment of Moderate to Severe Vasomotor Symptoms"
      gives TREATS and the object; "due to Menopause" ties the symptoms to menopause, recorded as the
      life stage; "a woman" gives the sex.
    status: DRAFT
    notes: >-
      Quoted from the Highlights, whose lead carries the population ("in a woman with a uterus"); the
      full-text item (1.1) restates the indication without it. Having a uterus is a population
      restriction with no slot (it is not a condition); it stays in the quote. Menopause is recorded
      as a life stage (as pregnancy is for "edema of pregnancy"), not as a disease context, since it is
      not a disease. "Treatment of" -> TREATS per the decision table, although the claim is
      symptomatic. Product-level ("an estrogen and progestin combination"), unattributed.
