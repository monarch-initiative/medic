notes: >-
  Not curated: "Known anaphylactic reaction, angioedema, or hypersensitivity to estradiol and
  norethindrone acetate tablets" (allergy to the product itself); the Limitations of Use under 1.2
  and 1.3. The Highlights restate the full-text contraindications. All claims are product-level
  ("an estrogen and progestin combination"); the label assigns none to an ingredient.
