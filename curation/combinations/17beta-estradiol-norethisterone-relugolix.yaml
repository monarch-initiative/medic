        restriction; HP:6000309 "Menstruating female between menarche and menopause" is a
        past-medical-history phenotype, not a life stage)
    sex:
      text: women
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    explanation: >-
      "is indicated for the management of heavy menstrual bleeding" gives TREATS and the object;
      "associated with uterine leiomyomas (fibroids)" is the disease context; "in premenopausal
