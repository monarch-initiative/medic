  of its own: the label gives it as the heading of a risk-factor list ("Examples include ..."), and each
  listed risk factor is its own claim. Not curated: "known anaphylactic reaction, angioedema, or
  hypersensitivity to MYFEMBREE or any of its components" (allergy to the product itself); the
  Limitations of Use (24-month limit for bone loss), which the helper prints as LIMITATION_STATEMENT
  in both the Highlights and the full text. The Highlights restate the full-text indications and
  contraindications.
