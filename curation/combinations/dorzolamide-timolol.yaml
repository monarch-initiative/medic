  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: elevated intraocular pressure
      term:
        id: HP:0007906
        label: Ocular hypertension
      binding: EXACT
    quote: >-
      Dorzolamide hydrochloride and timolol maleate ophthalmic solution is indicated for the
      reduction of elevated intraocular pressure (IOP) in patients with open-angle glaucoma or
      ocular hypertension who are insufficiently responsive to beta-blockers (failed to achieve
      target IOP determined after multiple measurements over time).
    disease_context:
      text: open-angle glaucoma or ocular hypertension
      member: open-angle glaucoma
      term:
        id: MONDO:0005338
        label: open-angle glaucoma
      binding: EXACT
    line_of_therapy:
      text: who are insufficiently responsive to beta-blockers
      term_gap: >-
        A prior-therapy requirement stated in words; no ontology term is sought for a line of
        therapy.
    explanation: >-
      "is indicated for the reduction of elevated intraocular pressure (IOP)" gives TREATS with the
      raised pressure as the object; "in patients with open-angle glaucoma or ocular hypertension"
      restricts it, and this claim covers the open-angle glaucoma member. "who are insufficiently
      responsive to beta-blockers" is the prior-therapy requirement, defined in the parentheses.
    status: DRAFT
    notes: >-
      HP Ocular hypertension has the exact synonym "Elevated intraocular pressure", so the object
      is the sign the product lowers; the patient's disease goes in disease_context. TREATS rather
      than AMELIORATES_CONDITION: "indicated for the reduction of" a sign is the label's
      indication wording, not symptom relief. The following sentence (comparison with concomitant
      timolol and dorzolamide) is efficacy information and makes no claim. Product-level,
      unattributed.
