      binding: EXACT
    quote: >-
      Neomycin and polymyxin B sulfates and gramicidin ophthalmic solution is indicated for the
      topical treatment of superficial infections of the external eye and its adnexa caused by
      susceptible bacteria. Such infections encompass conjunctivitis, keratitis and
      keratoconjunctivitis, blepharitis and blepharoconjunctivitis.
    explanation: >-
      "is indicated for the topical treatment of superficial infections of the external eye and
      its adnexa caused by susceptible bacteria" gives TREATS; this claim covers the adnexa member
      ("its adnexa", the adnexa of the eye). The eyelid infections in the next sentence
      (blepharitis, blepharoconjunctivitis) are recorded as its examples.
    status: DRAFT
    notes: >-
      MONDO has no infection-of-ocular-adnexa term (searched "adnexa", "eye adnexa", "eyelid
      infection"; eye adnexa disorder is not an infection), so bacterial infectious disease is
      BROADER, with the ocular adnexa as anatomical context. The two members are bound
      differently on purpose: for the external eye a site-specific infection term exists (eye
      infectious disorder, which drops "bacterial"); for the adnexa none does, so the bacterial
      term is bound and the site is carried by the anatomical context. blepharitis and blepharoconjunctivitis
      are bound as written: MONDO has no bacterial blepharitis term. Blepharoconjunctivitis also
      involves the conjunctiva; it is listed here because the eyelid is the adnexal site.
      Product-level, unattributed. The only contraindication ("hypersensitivity to any of its
      components") is allergy to the product's own ingredients and is not curated, so this file
      has no CONTRAINDICATED_IN claims.
