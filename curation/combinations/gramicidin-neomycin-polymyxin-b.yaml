    quote: >-
      Neomycin and polymyxin B sulfates and gramicidin ophthalmic solution is indicated for the
      topical treatment of superficial infections of the external eye and its adnexa caused by
      susceptible bacteria. Such infections encompass conjunctivitis, keratitis and
      keratoconjunctivitis, blepharitis and blepharoconjunctivitis.
    explanation: >-
      "is indicated for the topical treatment of superficial infections of the external eye ...
      caused by susceptible bacteria" gives TREATS; this claim covers the external-eye member of
      "the external eye and its adnexa". The next sentence ("Such infections encompass ...") lists
      the infections covered; the external-eye ones (conjunctivitis, keratitis,
      keratoconjunctivitis) are recorded as examples.
    status: DRAFT
    notes: >-
      eye infectious disorder is BROADER: MONDO has no bacterial or superficial eye infection term
      (searched "bacterial eye", "eye infection"). "caused by susceptible bacteria" stays in the
      object text; there is no causative-organism slot. The examples are bound to their infective
      forms where MONDO has one (bacterial conjunctivitis; corneal infection, exact synonym
      "infective keratitis"), NARROWER than the bare words but stated by "Such infections";
      MONDO's infectious keratoconjunctivitis term is non-human only, so keratoconjunctivitis is
      bound as written. "topical" is the route, not a qualifier. Product-level sentence ("...
      ophthalmic solution is indicated"), unattributed.
