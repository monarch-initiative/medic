  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
      binding: EXACT
    quote: >-
      SYNJARDY is a combination of empagliflozin and metformin hydrochloride (HCl) immediate-release
      indicated as an adjunct to diet and exercise to improve glycemic control in adults and
      pediatric patients aged 10 years and older with type 2 diabetes mellitus .
    age_range:
      min_years: 10
      text: aged 10 years and older
    explanation: >-
      "indicated ... to improve glycemic control in adults and pediatric patients aged 10 years and
      older with type 2 diabetes mellitus" states treatment of type 2 diabetes mellitus for
      SYNJARDY; "aged 10 years and older" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed: the subject is the product ("a combination of empagliflozin and
      metformin hydrochloride"), which names both ingredients only as its contents. "as an adjunct
      to diet and exercise" names non-drug measures, kept in the quote. The label covers two
      formulations with different age bounds; this claim is the immediate-release SYNJARDY's.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
      binding: EXACT
    quote: >-
      SYNJARDY XR is a combination of empagliflozin and metformin HCl extended-release indicated as
      an adjunct to diet and exercise to improve glycemic control in adults with type 2 diabetes
      mellitus .
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      "indicated ... to improve glycemic control in adults with type 2 diabetes mellitus" states
      treatment of type 2 diabetes mellitus for SYNJARDY XR; "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed, as the SYNJARDY claim. Kept as its own claim because the
      extended-release formulation is indicated for adults only, a narrower context than
      SYNJARDY's "aged 10 years and older".
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: severe renal impairment
      term:
        id: HP:0000083
        label: Renal insufficiency
      binding: BROADER
    quote: >-
      severe renal impairment (eGFR less than 30 mL/min/1.73 m 2 )
    explanation: >-
      Under "are contraindicated in patients with:", the item "severe renal impairment (eGFR less than
      30 mL/min/1.73 m 2 )" lists severe renal impairment as a contraindicated condition; the eGFR
      threshold defines "severe".
    status: DRAFT
    notes: >-
      Product-level, unattributed. HP Renal insufficiency is the term for impaired renal function
      (as for "Renal impairment" in the drospirenone file); no severe-renal-insufficiency term
      (searched HP "severe renal", "renal impairment"), so BROADER.
  - relation: CONTRAINDICATED_IN
