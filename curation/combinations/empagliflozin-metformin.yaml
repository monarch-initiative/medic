notes: >-
  Not claimed: the Limitations of Use (type 1 diabetes mellitus and diabetic ketoacidosis there;
  "Because of the metformin HCl component, the use ... is limited to patients with type 2
  diabetes mellitus"; chronic kidney disease with polycystic kidney disease or immunosuppressive
  therapy, "not expected to be effective"); "hypersensitivity to empagliflozin, metformin HCl or any
  of the excipients" (own ingredients) and "reactions such as angioedema have occurred" (a report,
  not a contraindicated condition). The Highlights restate the indications and contraindications.
  The glycemic-control indications and the contraindications are the product's, so none is
  attributed.
  NOT YET CURATED: the empagliflozin-only indications under the list lead "Empagliflozin, when
  used as a component of SYNJARDY or SYNJARDY XR, is indicated in adults with type 2 diabetes
  mellitus to reduce the risk of:". The label assigns them to empagliflozin, but the validator's
  INGREDIENT_SUBJECT check allows at most 40 characters between the subject and "is" once the
  product's name is blanked, and this subject is 41 characters from its verb, so the true
  attribution cannot pass. Recording them unattributed would state them of the product, crediting
  metformin with heart-failure and kidney outcomes the label gives to empagliflozin alone, so they
  are left out until the check accepts the attribution. Planned, each PREVENTATIVE_FOR_CONDITION,
  age_range adults, attributed to CHEBI:82720 by INGREDIENT_SUBJECT on that lead: (1)
  "hospitalization for heart failure" (MONDO:0005252 heart failure, BROADER), context "heart
  failure"; (2) "Sustained decline in eGFR" (HP:0012213 Decreased glomerular filtration rate,
  BROADER) and "end-stage kidney disease" (MONDO:0004375 end stage renal failure, EXACT), context
  "chronic kidney disease at risk of progression" (MONDO:0005300 chronic kidney disease).
  "Cardiovascular (CV) death" / "CV death" is an outcome, not a condition (as "death" in the
  aspirin/omeprazole file), and the bare "hospitalization" in the kidney item names no condition;
  neither would be claimed.
