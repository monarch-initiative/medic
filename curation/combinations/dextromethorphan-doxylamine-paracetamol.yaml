notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications
  section. Uses is an OTC symptom list under "temporarily relieves common cold/flu symptoms:": one
  AMELIORATES_CONDITION claim per symptom per named condition (the members common cold and flu of
  "common cold/flu", each recorded as the disease context's member). "runny nose and sneezing" is split
  into its two symptoms. No use is assigned to an ingredient by the label, so no claim is attributed.
  No contraindication is curated: "with any other drug containing acetaminophen" and "if you are now
  taking a prescription monoamine oxidase inhibitor (MAOI)" are drug interactions with no condition
  (the parenthesis "certain drugs for depression, psychiatric, or emotional conditions, or
  Parkinson's disease" describes what MAOIs are for, not a patient condition); "if you have ever had
  an allergic reaction to this product or any of its ingredients" is allergy to the product's own
  ingredients. The SPL product name is "night time", kept as the helper wrote it.
