  - relation: TREATS
    section: INDICATIONS
    object:
      text: primary hyperlipidemia
      term:
        id: MONDO:0021187
        label: hyperlipidemia
      binding: BROADER
    quote: >-
      As an adjunct to diet to reduce elevated low density lipoprotein cholesterol (LDL-C): • In
      adults with primary hyperlipidemia.
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      Under the product-level lead "are a combination of simvastatin and ezetimibe indicated:", "As
      an adjunct to diet to reduce elevated low density lipoprotein cholesterol (LDL-C): • In adults
      with primary hyperlipidemia" states treatment (LDL-C lowering) of primary hyperlipidemia;
      "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed. Adjunct to diet (a non-drug measure, kept in the quote). No
      primary-hyperlipidemia term (searched MONDO "hyperlipidemia"); hyperlipidemia is broader, as
      the grounding store's broadMatch row says, and as in the amlodipine/atorvastatin file.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: heterozygous familial hypercholesterolemia
      term:
        id: MONDO:0005439
        label: familial hypercholesterolemia
      binding: BROADER
    quote: >-
      In adults and pediatric patients aged 10 years and older with heterozygous familial
      hypercholesterolemia (HeFH).
    age_range:
