        label: homozygous familial hypercholesterolemia
      binding: EXACT
    quote: >-
      As an adjunct to other LDL-C-lowering therapies to reduce elevated LDL-C in adults with
      homozygous familial hypercholesterolemia (HoFH).
    in_combination_with:
