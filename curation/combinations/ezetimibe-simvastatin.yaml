      text: aged 10 years and older
    explanation: >-
      Under "indicated: • As an adjunct to diet to reduce elevated low density lipoprotein
      cholesterol (LDL-C):", the item "In adults and pediatric patients aged 10 years and older
      with heterozygous familial hypercholesterolemia (HeFH)" states treatment of HeFH; "aged 10
      years and older" is the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed. No heterozygous-FH term in MONDO (searched "familial
      hypercholesterolemia", "heterozygous"); familial hypercholesterolemia is broader, as in the
      amlodipine/atorvastatin file. Grounding store maps the phrase to UMLS:C0342882. Adjunct to
      diet (from the sub-lead, outside the item-sized quote).
  - relation: TREATS
