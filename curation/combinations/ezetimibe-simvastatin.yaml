    status: DRAFT
    notes: >-
      Product-level, unattributed. Unlike the atorvastatin label ("or alone if such treatments are
      unavailable"), this label makes the co-therapy part of the indication, so it is recorded in
      in_combination_with. The Highlights copy reads "LDL-C lowering therapies" (no hyphen); the
