notes: >-
  Not claimed: the strong-CYP3A4-inhibitor and cyclosporine/danazol bullets (pure drug-drug
  interactions with no condition; the full text reads "cyclosporine, danazol, or danazol" where the
  Highlights read "cyclosporine, danazol or gemfibrozil", an apparent label error); hypersensitivity
  to simvastatin, ezetimibe or the excipients (own ingredients); "Hypersensitivity reactions,
  including anaphylaxis, angioedema, and Stevens-Johnson syndrome, have been reported" (a report of
  adverse reactions, not a contraindicated condition). The three lipid-lowering indications are
  product-level ("a combination of simvastatin and ezetimibe indicated:").
  NOT YET CURATED: the cardiovascular-risk indication "Simvastatin, when used as a component of
  ezetimibe and simvastatin tablets, is indicated to reduce the risk of total mortality by reducing
  risk of coronary heart disease death, non-fatal myocardial infarction and stroke, ... in adults
  with established coronary heart disease, cerebrovascular disease, peripheral vascular disease,
  and/or diabetes". The label assigns it to simvastatin, but the validator's INGREDIENT_SUBJECT
  check allows at most 40 characters between the subject and "is" once the product name is
  blanked, and this subject is 42 characters from its verb, so the true attribution cannot pass.
  Recording these claims without attributed_to would state them of the product, crediting
  ezetimibe with myocardial infarction and stroke prevention, which the label does not say; they
  are therefore left out until the check accepts the attribution. Planned: PREVENTATIVE_FOR_CONDITION
  non-fatal myocardial infarction (MONDO:0005068, EXACT) and stroke (MONDO:0005098, EXACT), each
  with the four disease_context members (coronary artery disorder, cerebrovascular disorder,
  peripheral vascular disease, diabetes mellitus), age_range adults, attributed to CHEBI:9150 by
  INGREDIENT_SUBJECT. "total mortality", "coronary heart disease death" and the revascularization
  procedures name no separate condition to prevent.
