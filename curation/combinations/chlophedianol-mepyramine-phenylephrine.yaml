  OTC Drug Facts label; the Uses text is the indication section and "Do not use this product" the Contraindications
  section. Uses is an OTC symptom list under "temporarily relieves these symptoms due to the common cold,
  hay fever (allergic rhinitis) or other upper respiratory allergies:": one AMELIORATES_CONDITION claim
  per symptom per named condition (the three members of that coordination, each recorded as the disease
  context's member). "itching of the nose or throat" and "itchy, water eyes" are split into their members;
  "water eyes" is the label's typo, kept verbatim. "reduces swelling of nasal passages" is an effect of
  the product, not a symptom or condition, and is not curated. No use is assigned to an ingredient by
  the label, so no claim is attributed. The only "Do not use" item, "if you are now taking a prescription
  monoamine oxidase inhibibor (MAOI) ...", is a drug interaction with no patient condition (the parenthesis
  describes what MAOIs are for), so no contraindication is curated.
