notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the
  Contraindications section. In the SPL, Uses is a bullet list whose first bullet, "temporarily
  relieves these common cold and flu symptoms:", holds a nested list (nasal congestion, headache,
  minor aches and pains, sinus congestion and pressure): one AMELIORATES_CONDITION claim per symptom
  per named condition (the members common cold and flu of "common cold and flu"). "sinus congestion
  and pressure" is split into its two members, both unbound as in the DayQuil file. "temporarily
  reduces fever" is a separate top-level bullet and carries no context. Not curated: "helps loosen
  phlegm (mucus) and thin bronchial secretions ... make coughs more productive" and "temporarily
  promotes nasal and/or sinus drainage" (effects of the product, not symptoms or conditions). No use
  is assigned to an ingredient by the label, so no claim is attributed. No contraindication is
  curated: "with any other drug containing acetaminophen" and "if you are now taking a prescription
  monoamine oxidase inhibitor (MAOI) ... or for 2 weeks after stopping the MAOI drug" are drug
  interactions with no patient condition (the parenthesis describes what MAOIs are for); "if you
  have ever had an allergic reaction to this product or any of its ingredients" is allergy to the
  product's own ingredients. The SPL title "CVS 44-615-Delisted" is kept as printed.
