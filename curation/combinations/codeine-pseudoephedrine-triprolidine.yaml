notes: >-
  Prescription-format label. The single indication sentence is split per symptom (coughs; upper respiratory
  symptoms, with nasal congestion as its listed example) and per condition (allergy; the common cold),
  as in the brompheniramine/dextromethorphan/pseudoephedrine file. No indication or contraindication is
  assigned to an ingredient by name. Not curated: "newborn" (an age population with no condition); "Antihistamines
  should not be used to treat lower respiratory tract symptoms, including asthma" (what the product should
  not be used to treat, read as a limitation of use, as in the brompheniramine/dextromethorphan/pseudoephedrine
  file; flagged for review, since here it sits under "contraindicated under the following conditions"
  with the heading "Use in Lower Respiratory Disease"); hypersensitivity to codeine phosphate, triprolidine
  hydrochloride and pseudoephedrine (the product's own ingredients); "in patients on monoamine oxidase
  (MAO) inhibitor therapy" (a drug interaction). The SPL carries no product name, so product_name is left
  as the helper wrote it (empty).
