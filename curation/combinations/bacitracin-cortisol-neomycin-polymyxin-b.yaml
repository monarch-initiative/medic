  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: infection
      term:
        id: MONDO:0043885
        label: eye infectious disorder
      binding: NARROWER
    quote: >-
      The use of a combination drug with an anti-infective component is indicated where the risk of infection
      is high or where there is an expectation that potentially dangerous numbers of bacteria will be
      present in the eye
    explanation: >-
      "The use of a combination drug with an anti-infective component is indicated where the risk of infection
      is high" is read as prevention of infection: the label does not say "prevent", but it indicates
      the anti-infective component for patients at high risk of infection. "potentially dangerous numbers
      of bacteria will be present in the eye" is an alternative setting and names no separate condition.
    status: DRAFT
    notes: >-
      eye infectious disorder is NARROWER than the bare word "infection", justified by the ophthalmic
      product and the ocular context of its Indications section. The sentence names the anti-infective
      only by its role ("an anti-infective component"), never an ingredient, so the claim is not attributed;
      it points to neomycin, polymyxin B and bacitracin. The quote stops before the cross-reference "(see
      CLINICAL PHARMACOLOGY: Microbiology )". The organism list that follows ("active against the following
      common bacterial eye pathogens") is microbiology, not a claim, and there is no causative-organism
      slot to hold it; "does not provide adequate coverage against Serratia marcescens" gives no claim.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: viral diseases of the cornea and conjunctiva
      member: viral diseases of the cornea
      term:
        id: MONDO:0020950
        label: viral eye infection
      binding: BROADER
    examples:
    - text: epithelial herpes simplex keratitis (dendritic keratitis)
      term:
        id: MONDO:0015288
        label: herpes simplex virus keratitis
      binding: BROADER
    - text: vaccinia
      term:
        id: MONDO:0002595
        label: vaccinia
      binding: EXACT
    - text: varicella
      term:
        id: MONDO:0005700
        label: chickenpox
      binding: EXACT
    quote: >-
      Neomycin and polymyxin B sulfates and bacitracin zinc with hydrocortisone acetate ophthalmic ointment
      is contraindicated in most viral diseases of the cornea and conjunctiva including: epithelial herpes
      simplex keratitis (dendritic keratitis), vaccinia and varicella, and also in mycobacterial infection
      of the eye and fungal diseases of ocular structures.
    explanation: >-
      "contraindicated in most viral diseases of the cornea and conjunctiva including ..." gives CONTRAINDICATED_IN;
      this claim covers the cornea member of "viral diseases of the cornea and conjunctiva". The diseases
      after "including" are recorded as examples; "most" is a hedge on the category and is not a qualifier.
    status: DRAFT
    notes: >-
      MONDO has no viral keratitis term (searched "viral keratitis"), so viral eye infection is BROADER
      for the cornea member. herpes simplex virus keratitis (exact synonym "dendritic keratitis") is BROADER
      than the epithelial form the label names, since it also covers stromal disease. Herpes simplex keratitis
      is a corneal disease and is listed only on the cornea member; vaccinia and varicella name no site
      and are listed on both members. The product is the subject ("... ophthalmic ointment is contraindicated").
      Product-level, unattributed. Hypersensitivity "to any of its components" is allergy to the product's
      own ingredients and is not curated; "Hypersensitivity to the antibiotic component occurs at a higher
      rate than for other components" is an incidence statement, not a contraindication.
