notes: 'OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications section.
  Uses is an OTC symptom list under "temporarily relieves these cold, sinus, and flu symptoms:" (the SPL text has
  lost its bullets; the items are read as sinus pressure, minor body aches and pains, headache, nasal and sinus
  congestion, fever): one AMELIORATES_CONDITION claim per symptom per named condition. The conditions are the members
  cold (the common cold) and flu of "cold, sinus, and flu"; "sinus" there names a site, not a disease (the label
  does not say sinusitis), so it gives no context and the symptoms are not curated with sinusitis. The cold member
  is left unbound with a term_gap: the grounding store maps "cold" to MONDO:0005002 chronic obstructive pulmonary
  disease (lexical match on its synonym "COLD"), and the validator then rejects common cold as unrelated; a human
  should add a semapv:ManualMappingCuration row and bind MONDO:0005709 common cold. "nasal and sinus congestion"
  is split into its two members. The parenthesis "(promotes sinus drainage and restores freer breathing through
  the nose)" describes effects, not conditions, and is not curated. No use is assigned to an ingredient by the label,
  so no claim is attributed. Contraindications curated: the allergic reaction to any other pain reliever/fever reducer.
  Not curated: "in children under 12 years of age" (an age population with no condition); "right before or after
  heart surgery" (a procedure, not a condition); the MAOI item ("if you are now taking a prescription monoamine
  oxidase inhibitor (MAOI) ... or for 2 weeks after stopping the MAOI drug"), a drug interaction with no patient
  condition (the parenthesis "certain drugs for depression, psychiatric, or emotional conditions, or Parkinson''s
  disease" describes what MAOIs are used for, not a patient condition).'
