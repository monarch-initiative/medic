      allergy. Not attributed: the agents are allergens.'
notes: 'OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications section.
  Uses is an OTC symptom list under "temporarily relieves these symptoms associated with the common cold or flu:":
  one AMELIORATES_CONDITION claim per symptom per named condition (the members the common cold and flu, each recorded
  as the disease context''s member). "reduces swelling of the nasal passages" and "temporarily restores freer breathing
  through the nose" are effects, not conditions, and are not curated. No use is assigned to an ingredient by the
  label, so no claim is attributed. Contraindications curated: the allergic reaction to any other pain reliever/fever
  reducer. Not curated: "in children under 12 years of age because this product contains too much medication for
  children under this age" (an age population with no condition); "right before or after heart surgery" (a procedure,
  not a condition); the MAOI item ("if you are now taking a prescription monoamine oxidase inhibitor (MAOI) ...
  or for 2 weeks after stopping the MAOI drug"), a drug interaction with no patient condition (the parenthesis "certain
  drugs for depression, psychiatric, or emotional conditions, or Parkinson''s disease" describes what MAOIs are
  used for, not a patient condition). The pipeline listed this product''s ibuprofen as dexibuprofen (a combination_split
  row in mappings/drug_grounding.sssom.tsv maps "IBUPROFEN" to CHEBI:43415 dexibuprofen); the SPL active moiety
  is IBUPROFEN and the label helper grounds it to CHEBI:5855 ibuprofen, which this file uses.'
