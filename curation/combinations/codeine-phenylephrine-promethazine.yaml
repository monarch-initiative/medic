notes: >-
  Prescription-format label. The single indication sentence is split per symptom (coughs; upper respiratory
  symptoms, with nasal congestion as its listed example) and per condition (allergy; the common cold),
  as in the brompheniramine/dextromethorphan/pseudoephedrine file. No indication is assigned to an ingredient.
  Contraindications curated: promethazine's comatose states, hypersensitivity and idiosyncratic reaction
  to other phenothiazines (attributed to promethazine, the subject of "is contraindicated"); phenylephrine's
  hypertension and peripheral vascular insufficiency (attributed to phenylephrine). Not curated: "Codeine
  is contraindicated in patients with a known hypersensitivity to the drug" and "Phenylephrine should
  not be used in patients known to be hypersensitive to the drug" (allergy to the product's own ingredients);
  "or in those receiving a monoamine oxidase inhibitor (MAOI)" (a drug interaction); "contraindicated
  in pediatric patients less than 6 years of age, because the combination may cause fatal respiratory
  depression" (an age population with no condition; the respiratory depression is the risk, not a patient
  condition); "Antihistamines and codeine are both contraindicated for use in the treatment of lower respiratory
  tract symptoms, including asthma" (left for the reviewer: it sits in the Contraindications section and
  says "contraindicated", but what it contraindicates is a use, "for use in the treatment of" lower respiratory
  tract symptoms, not a patient condition; it is worded more strongly than the brompheniramine/dextromethorphan/pseudoephedrine
  file's "should not be used to treat", which that file also left uncurated. If curated, the object would
  be "lower respiratory tract symptoms" (term_gap) with asthma as an example, attributable to codeine
  as a co-subject).
