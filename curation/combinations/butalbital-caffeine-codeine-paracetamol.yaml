        label: porphyria
      binding: EXACT
    quote: Porphyria
    explanation: >-
      An item of "Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules are also contraindicated
      in patients with:": "Porphyria".
    status: DRAFT
    notes: >-
      Grounding store maps "Porphyria" to UMLS:C0032708, in no configured ontology. Not attributed.
notes: >-
  Prescription label (PLR format). Not curated: the Limitations of Use paragraphs (opioid and butalbital
  risk reservation); "All children younger than 12 years of age" (an age group with no condition, a known
  missing slot); "Post-operative management in children younger than 18 years of age following tonsillectomy
  and/or adenoidectomy" (a procedure context, not a condition); "Concurrent use of monoamine oxidase inhibitors
  (MAOIs) or use of MAOIs within the last 14 days" (a drug interaction); "Known intolerance or hypersensitivity
  to acetaminophen, caffeine, butalbital, or codeine or to the components" (own ingredients). "in an unmonitored
  setting or in the absence of resuscitative equipment" restricts the asthma contraindication to a care
  setting; no slot, kept in the quote. The full-text Contraindications list runs its items together without
  sentence breaks; quotes are the item words only. No claim is attributed: every claim is stated of the
  product.
