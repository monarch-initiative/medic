    title: 'These highlights do not include all the information needed to use BUTALBITAL, ACETAMINOPHEN,
      CAFFEINE, and CODEINE PHOSPHATE CAPSULES safely and effectively. See full prescribing information
      for BUTALBITAL, ACETAMINOPHEN, CAFFEINE, and CODEINE PHOSPHATE CAPSULES. BUTALBITAL, ACETAMINOPHEN,
