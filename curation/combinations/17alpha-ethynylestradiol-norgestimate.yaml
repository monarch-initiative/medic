notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the label
  gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."), and
  each listed risk factor is its own claim. Not curated: use of hepatitis C drug combinations containing
  ombitasvir/paritaprevir/ritonavir, with or without dasabuvir (drug interaction, no condition). The Highlights
  copy restates the full-text contraindications in shorter form ("Liver tumors or liver disease"); full-text
  items are quoted, except breast cancer, where only the Highlights add "other estrogen- or progestin-sensitive
  cancer" and that coordination is quoted. This Sprintec label carries no acne indication.
