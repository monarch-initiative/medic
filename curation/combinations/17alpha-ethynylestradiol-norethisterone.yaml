    quote: >-
      Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets are indicated for
      the prevention of pregnancy in women who elect to use combined oral contraceptives as a method of
      contraception.
    sex:
      text: women
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    explanation: >-
      "indicated for the prevention of pregnancy" is contraception: PREVENTATIVE_FOR_CONDITION with pregnancy
      as the object; "in women" gives the sex.
    status: DRAFT
    notes: >-
      "who elect to use combined oral contraceptives as a method of contraception" is a population criterion,
      not a co-therapy. Object unbound (no configured ontology has a pregnancy term). The generic product
      name lists both ingredients and the ferrous fumarate tablets but assigns nothing to either ingredient;
      product-level claim, unattributed. The efficacy table that follows, and its footnotes on emergency
      contraception and the lactational amenorrhea method, describe other methods and products, not this
      one; no claim.
