    quote: Known or suspected pregnancy
    explanation: >-
      An item of "contraindicated in females who are known to have or develop the following conditions:":
      pregnancy, known or suspected. "Known or suspected" qualifies the certainty, not the condition, so
      there is one claim and no member.
    status: DRAFT
    notes: Unbound for lack of a term.
notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the label
  gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."), and
  each listed risk factor is its own claim. Not curated: women receiving hepatitis C drug combinations
  containing ombitasvir/paritaprevir/ritonavir, with or without dasabuvir (drug interaction, no condition).
  This label lists no hypersensitivity contraindication. The ferrous fumarate tablets are not an active
  ingredient in the SPL (the helper lists only ethinyl estradiol and norethindrone), so the file covers
  the two hormones. This older-format label has no Highlights.
