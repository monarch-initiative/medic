    quote: >-
      Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets are indicated for
      the treatment of moderate acne vulgaris in females, ≥ 15 years of age, who have no known contraindications
      to combined oral contraceptive therapy, desire oral contraception, have achieved menarche, and are
