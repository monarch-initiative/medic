notes: >-
  Prescription label (PLR format), extended-release suspension. Indication split per symptom (cough; upper
  respiratory symptoms) and per condition (allergy; the common cold), each with age_range min 18. Not
  curated: the Limitations of Use paragraphs; "All children younger than 6 years of age" (an age group
  with no condition, a known missing slot); hypersensitivity to hydrocodone, chlorpheniramine or the inactive
  ingredients (own ingredients). "in an unmonitored setting or in the absence of resuscitative equipment"
  restricts the asthma contraindication to a care setting; no slot, kept in the quote. No claim is attributed:
  every contraindication is stated of the product.
