      "indicated for the temporary relief of" gives AMELIORATES_CONDITION. "cough and upper respiratory
      symptoms" names two conditions; this claim is the member "cough". "associated with allergy or the
      common cold" names the conditions they occur in; this claim takes the member "allergy" as the disease
      context (one claim per symptom per condition). "in patients 18 years of age and older" gives the
      age range.
    status: DRAFT
    notes: >-
      Reading: "associated with allergy or the common cold" qualifies both the cough and the upper respiratory
      symptoms, as in codeine-phenylephrine-promethazine.yaml (sibling PR #76). Product-level, unattributed.
