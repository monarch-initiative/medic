notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the
  Contraindications section. The first Uses bullet gives two uses: cough "occurring with a cold"
  (one claim; its context "a cold" is unbound, see its term_gap) and nasal congestion "due to the
  common cold, hay fever or other upper respiratory allergies" (one claim per member of that
  coordination). The second bullet, "temporarily relieves these symptoms due to hay fever (allergic
  rhinitis):", is followed in the SPL by sibling bullets (runny nose; sneezing; itchy, watery eyes;
  itching of the nose or throat), read as its symptom list; each gets one claim with hay fever as
  context, the two coordinations split into their members. "temporarily restores freer breathing
  through the nose" is an effect of the product, not a symptom or condition, and is not curated. No
  use is assigned to an ingredient by the label, so no claim is attributed. No contraindication is
  curated: current or recent prescription MAOI use is a drug interaction with no patient condition
  (the parenthesis describes what MAOIs are for), and "to make a child sleepy" is a prohibited
  purpose, not a patient condition.
