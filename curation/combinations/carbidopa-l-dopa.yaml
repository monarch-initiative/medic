notes: >-
  Not curated: the nonselective MAO inhibitor contraindication (a drug interaction with no
  condition); "known hypersensitivity to any component of this drug" (allergy to the product's own
  components); "Carbidopa allows patients treated for Parkinson's disease to use much lower doses of
  levodopa", "Some patients who responded poorly to levodopa have improved ..." and the
  decarboxylation sentence (pharmacology, no new condition); "Carbidopa has not been shown to
  enhance the intrinsic efficacy of levodopa" (negated). "Carbidopa may also reduce nausea and
  vomiting and permit more rapid titration of levodopa" is not curated: it is hedged, sits in the
  paragraph explaining why carbidopa is combined with levodopa, and states an effect rather than an
  indication; an unqualified carbidopa -> nausea edge would overstate it.
