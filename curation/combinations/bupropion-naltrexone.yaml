notes: >-
  Not curated: "Use of other bupropion-containing products", "Chronic opioid ... use" and the MAOI
  items (drug interactions with no condition; "Starting CONTRAVE in a patient treated with
  reversible MAOIs such as linezolid or intravenous methylene blue" likewise); "Known allergy to
  bupropion, naltrexone or any other component of CONTRAVE" (allergy to the product's own
  ingredients); "Anaphylactoid/anaphylactic reactions and Stevens-Johnson syndrome have been reported
  with bupropion" (a statement of risk, not a contraindicated condition); the Limitations of Use
  ("has not been established", coadministration with other naltrexone- or bupropion-containing
  products). The Highlights copies of the indication and contraindications restate the full text.
