  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: obesity or overweight
      member: obesity
      term:
        id: MONDO:0011122
        label: obesity disorder
      binding: EXACT
    age_range:
      min_years: 18
      text: adults
    quote: >-
      CONTRAVE is indicated in combination with a reduced-calorie diet and increased physical
      activity to reduce excess body weight and maintain weight reduction long term in adults with
      obesity or overweight in the presence of at least one weight-related comorbid condition.
    explanation: >-
      "indicated ... to reduce excess body weight and maintain weight reduction long term in adults
      with obesity or overweight" is treatment of obesity (the first member of "obesity or
      overweight"); "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level sentence ("CONTRAVE is indicated"), so unattributed; the Highlights sentence
      naming naltrexone and bupropion describes their pharmacology and assigns the indication to
      neither. "in combination with a reduced-calorie diet and increased physical activity" names a
      lifestyle co-therapy, no agent, so it is left in the quote rather than in_combination_with.
      "in the presence of at least one weight-related comorbid condition" names no specific
      condition and is not recorded as a context. MONDO obesity disorder carries the exact synonym "obesity".
