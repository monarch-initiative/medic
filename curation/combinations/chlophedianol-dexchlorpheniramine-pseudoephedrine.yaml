notes: >-
  OTC Drug Facts label (VanaCof); the Uses text is the indication section and "Do not use this
  product" the Contraindications section. In the SPL, Uses has two top-level bullets. The first,
  "temporarily relieves these symptoms due to the common cold, hay fever (allergic rhinitis) or
  other upper respiratory allergies:", holds a nested list: one AMELIORATES_CONDITION claim per
  symptom per named condition (the three members of that coordination, each recorded as the disease
  context's member, bound as in brompheniramine-dextromethorphan-phenylephrine.yaml and
  dextromethorphan-doxylamine.yaml: common cold EXACT, hay fever as seasonal allergic rhinitis
  EXACT, other upper respiratory allergies as allergic respiratory disease BROADER). "itching of the
  nose or throat" and "itchy, watery eyes" are split into their members. "reduces swelling of nasal
  passages" is an effect of the product, not a symptom or condition, and is not curated. The second
  top-level bullet, "cough due to minor throat and bronchial irritation", carries no context. No use
  is assigned to an ingredient by the label, so no claim is attributed. The only "Do not use" item,
  current or recent prescription MAOI use, is a drug interaction with no patient condition (the
  parenthesis describes what MAOIs are for), so no contraindication is curated.
