  claims:
  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: pregnancy
      term_gap: >-
        searched MONDO "pregnancy", "pregnan", "contracept"; HP "pregnancy", "pregnant", "pregnan";
        PATO "pregnan": no term for pregnancy as a state (only pregnancy disorders, exposures and
        modifiers); the grounding store's UMLS:C0032961 is in no configured ontology
    quote: >-
      NEXTSTELLIS is indicated for use by females of reproductive potential to prevent pregnancy.
    sex:
      text: females
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    life_stage:
      text: of reproductive potential
      term_gap: >-
        searched HsapDv "adult", "menarche", "menopause"; PATO "female" (female fertile describes
        fertility, not a stage); HP "menarche": no reproductive-age life-stage term (adult stage
        would drop the restriction)
    explanation: >-
      "indicated for use by females of reproductive potential to prevent pregnancy" is contraception:
      PREVENTATIVE_FOR_CONDITION with pregnancy as the object; "females" gives the sex and "of
      reproductive potential" the life stage.
    status: DRAFT
    notes: >-
      The Highlights sentence ("NEXTSTELLIS is a combination of drospirenone, a progestin, and
      estetrol, an estrogen, indicated ...") names both ingredients by class but assigns the
      indication to the combination, so the claim is unattributed. The Limitations of Use (reduced
      effectiveness at BMI >= 30 kg/m2) produce no claim.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: arterial or venous thrombotic/thromboembolic diseases
      member: thrombotic diseases
      term:
        id: MONDO:0000831
        label: thrombotic disease
      binding: EXACT
    quote: >-
      NEXTSTELLIS is contraindicated in females who are known to have or develop the following
      conditions: A history of, increased risk for, or current arterial or venous
      thrombotic/thromboembolic diseases.
    explanation: >-
      The first item of "contraindicated in females who are known to have or develop the following
      conditions:" is "A history of, increased risk for, or current arterial or venous
      thrombotic/thromboembolic diseases". Current or past disease is contraindicated directly, so it
      is curated; "arterial or venous" is an exhaustive pair (every thrombosis), and
      "thrombotic/thromboembolic" coordinates two conditions. This claim is the member "thrombotic
      diseases".
    status: DRAFT
    notes: >-
      Unlike the "A high risk of arterial or venous thrombotic diseases" heading of the other
      drospirenone labels, this heading names the disease itself ("history of ... or current"), not
      only the risk, so it is curated as well as the risk factors that follow ("Examples include
      ..."), which carry the "increased risk for" part. No slot records "history of"; the object reads
      as current disease.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: arterial or venous thrombotic/thromboembolic diseases
      member: thromboembolic diseases
      term:
        id: HP:0001907
        label: Thromboembolism
      binding: EXACT
    quote: >-
      NEXTSTELLIS is contraindicated in females who are known to have or develop the following
      conditions: A history of, increased risk for, or current arterial or venous
      thrombotic/thromboembolic diseases.
    explanation: >-
      The same item; this claim is the member "thromboembolic diseases" of "arterial or venous
      thrombotic/thromboembolic diseases", current or past. HP Thromboembolism has the exact synonym
      "Thromboembolic disease".
    status: DRAFT
    notes: >-
      MONDO has only venous thromboembolism (MONDO:0005399), which would drop the arterial half of
      the exhaustive pair, so HP. No slot records "history of".
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Smoke
      term_gap: >-
        searched MONDO "smok", "tobacco", "nicotine"; HP "smok", "tobacco": only nicotine dependence /
        addictive nicotine use, HP:0430133 Tobacco use history (an exposure history, not current
        smoking) and modifiers ("Triggered by smoking"); no term for being a smoker
    quote: >-
      Examples include females who are known to: - Smoke, if 35 years of age and older
    age_range:
      min_years: 35
      text: 35 years of age and older
    explanation: >-
      Contraindicated as a thrombotic risk factor: smoking is listed after "Examples include females
      who are known to:", under the increased risk of thrombotic diseases; "if 35 years of age and
      older" restricts it, recorded as age_range (inclusive).
    status: DRAFT
    notes: >-
      A risk factor rather than a disease; unbound for lack of a term.
