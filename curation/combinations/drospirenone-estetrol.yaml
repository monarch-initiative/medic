notes: >-
  The first contraindication, "A history of, increased risk for, or current arterial or venous
  thrombotic/thromboembolic diseases", is curated for its current-or-past disease reading (two claims,
  thrombotic and thromboembolic disease); its "increased risk for" reading is carried by the
  risk-factor list that follows ("Examples include females who are known to: ..."), each item its own
  claim. Not curated: use of hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir
  (drug interaction, no condition); the Limitations of Use (BMI >= 30 kg/m2). The Highlights copy of
  the contraindications restates the full text in shorter form; the full-text items are quoted. Unlike
  the other drospirenone labels, this one lists no pregnancy contraindication and no PMDD or acne
  indication.
