notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the
  label gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."),
  and each listed risk factor is its own claim. Not curated: co-administration with
  ombitasvir/paritaprevir/ritonavir (drug interaction, no condition). The Highlights copy of the
  contraindications restates the full-text list. The DSM-IV description of PMDD and its feature list
  are background, not claims.
