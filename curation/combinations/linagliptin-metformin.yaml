  product_name: Linagliptin and metformin hydrochloride
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
      binding: EXACT
    quote: >-
      Linagliptin and metformin hydrochloride tablets are indicated as an adjunct to diet and exercise to improve glycemic control in adults with type 2 diabetes mellitus.
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      "indicated ... to improve glycemic control in adults with type 2 diabetes mellitus" states treatment of type 2 diabetes mellitus; "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed: the subject is the product's generic name, which lists both ingredients and attributes nothing. "as an adjunct to diet and exercise" names non-drug measures, kept in the quote, not in_combination_with.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: severe renal impairment
      term:
        id: HP:0000083
        label: Renal insufficiency
      binding: BROADER
    quote: >-
      severe renal impairment (eGFR below 30 mL/min/1.73 m 2 )
    explanation: >-
      Under "Linagliptin and metformin hydrochloride are contraindicated in patients with:", the bullet "severe renal impairment (eGFR below 30 mL/min/1.73 m 2 )" lists severe renal impairment as a contraindicated condition; the eGFR threshold defines "severe".
    status: DRAFT
    notes: >-
      Product-level, unattributed. HP Renal insufficiency is the term for impaired renal function,
      as in the metformin-combination files of PR #74; no severe-renal-insufficiency term (searched
      HP "severe renal", "renal impairment"), so BROADER.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: acute or chronic metabolic acidosis
      term:
        id: MONDO:0000440
        label: metabolic acidosis
      binding: EXACT
    examples:
    - text: diabetic ketoacidosis
      term:
        id: MONDO:0012819
        label: diabetic ketoacidosis
      binding: EXACT
    quote: >-
      acute or chronic metabolic acidosis, including diabetic ketoacidosis
    explanation: >-
      Under "Linagliptin and metformin hydrochloride are contraindicated in patients with:", the bullet "acute or chronic metabolic acidosis, including diabetic ketoacidosis" lists metabolic acidosis as a contraindicated condition; "acute or chronic" is an exhaustive pair covering the whole class, and "including diabetic ketoacidosis" names an example.
    status: DRAFT
    notes: >-
      Product-level, unattributed. One claim for the class (exhaustive pair), diabetic
      ketoacidosis as a listed example.
notes: >-
  Not claimed: the Limitations of Use (type 1 diabetes mellitus "not recommended"; "not been
  studied in patients with a history of pancreatitis"); "hypersensitivity to linagliptin,
  metformin, or any of the excipients" (own ingredients) and the reactions that "have occurred
  with linagliptin" (anaphylaxis, angioedema, exfoliative skin conditions, urticaria, bronchial
  hyperreactivity: a report of reactions to an own ingredient, not a contraindicated condition).
  The Highlights restate the indication and contraindications. The label names no component for
  the indication or the curated contraindications, so nothing is attributed. Although
  "Linagliptin and metformin hydrochloride are contraindicated" opens with "Linagliptin", the
  subject is the product's generic name, not linagliptin alone.
