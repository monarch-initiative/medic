notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the label
  gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."), and
  each listed risk factor is its own claim. "Do not prescribe Natazia to women who are known to have the
  following:" is this label's contraindication lead. The bracketed cross-references ("[see Warnings and
  Precautions ( 5.1 )]") are left out of the quotes. The Highlights copy restates the full-text contraindications
  in shorter form ("Liver tumors or liver disease"); full-text items are quoted. The label lists no hypersensitivity
  and no hepatitis C co-administration contraindication.
