notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications
  section. Uses is an OTC symptom list under "temporarily relieves these symptoms associated with hay
  fever or other upper respiratory allergies, and the common cold:": one AMELIORATES_CONDITION claim per
  symptom per named condition (hay fever, other upper respiratory allergies, the common cold, each recorded
  as the disease context's member). The label attaches the whole list to all three conditions, so every
  symptom is curated with each, including fever and body aches with the allergies; a reviewer may prefer
  to narrow that. "reduces swelling of the nasal passages" and "temporarily restores freer breathing through
  the nose" are effects, not conditions, and are not curated. No use is assigned to an ingredient. Contraindications
  curated: the allergic reaction to any other pain reliever/fever reducer. Not curated: "in children under
  12 years of age because this product contains too much medication" (an age population with no condition);
  "right before or after heart surgery" (a procedure, not a condition); the MAOI item (a drug interaction
  with no patient condition). The pipeline listed this product's ibuprofen as dexibuprofen (a combination_split
  row in mappings/drug_grounding.sssom.tsv maps "IBUPROFEN" to CHEBI:43415 dexibuprofen as a related-synonym
  closeMatch); the SPL active moiety is IBUPROFEN and the label helper grounds it to CHEBI:5855 ibuprofen,
  which this file uses. The validator warns that "fever" (the standalone bullet) is one item of a coordination;
  it matches the "fever" inside "hay fever" earlier in the quote, so the warning is a false positive.
