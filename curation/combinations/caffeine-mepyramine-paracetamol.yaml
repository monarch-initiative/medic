notes: >-
  OTC Drug Facts label (MENSTRUAL COMPLETE); the Uses text is the indication section and "Do not
  use" the Contraindications section. Uses is one symptom list under "for the temporary relief of
  these symptoms associated with menstrual periods:": one AMELIORATES_CONDITION claim per symptom,
  each with "menstrual periods" as an unbound disease context (menstruation is a physiological
  process with no term in the configured ontologies; recorded like the pregnancy and lactation
  states the skill curates unbound). No sex qualifier: the quote has no word naming the sex. No use
  is assigned to an ingredient by the label, so no claim is attributed. No contraindication is
  curated: "with any other drug containing acetaminophen" is a drug interaction with no patient
  condition, and "if you have ever had an allergic reaction to this product or any of its
  ingredients" is allergy to the product's own ingredients.
