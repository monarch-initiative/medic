notes: >-
  Old-format (non-PLR) label with no Highlights. Not claimed: the class-level
  cardiovascular-outcomes text after the indication (credited to antihypertensive drug classes,
  "including atenolol and chlorthalidone", not to this product, so it neither indicates nor
  attributes); "not indicated for initial therapy of hypertension" (a limitation); hypersensitivity
  to this product (own ingredients). All claims are product-level: the label never assigns an
  indication or contraindication to atenolol or chlorthalidone.
