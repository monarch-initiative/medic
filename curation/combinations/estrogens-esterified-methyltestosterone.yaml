  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: moderate to severe vasomotor symptoms
      term_gap: >-
        searched MONDO "vasomotor", "menopaus", "climacteric", "hot flash"; HP "vasomotor", "hot
        flash", "hot flush", "menopaus": no term for menopausal vasomotor symptoms; HP:0031217 Hot
        flashes names one vasomotor symptom only (night sweats are another), so binding it would say
        less than the label
    quote: >-
      Treatment of moderate to severe vasomotor symptoms associated with the menopause in those
      patients not improved by estrogens alone.
    life_stage:
      text: menopause
      term_gap: >-
        searched HsapDv "menopaus", "postmenopaus", "adult"; MONDO and HP "menopaus": no menopause
        life-stage term (HP:0008209 Early menopause and MONDO:0001119 premature menopause are
        disorders; adult stage would drop the restriction)
    line_of_therapy:
      text: not improved by estrogens alone
      term_gap: prior-therapy condition, no ontology term expected
    explanation: >-
      The item of "... are indicated in the:": "Treatment of moderate to severe vasomotor symptoms"
      gives TREATS and the object; "associated with the menopause" gives the life stage; "in those
      patients not improved by estrogens alone" restricts the line of therapy.
    status: DRAFT
    notes: >-
      Menopause is recorded as a life stage, not a disease context, since it is not a disease (as in
      the other menopausal hormone files). "not improved by estrogens alone" is a prior-therapy
      restriction; it names estrogen therapy, not an ingredient's role in this product, so it is no
      attribution. Not curated from the same Indications section: the parenthetical "There is no
      evidence that estrogens are effective for nervous symptoms or depression ..." and the bullet
      "... have not been shown to be effective for any purpose during pregnancy ..." (both negated).
      The label carries no DESI wording. Product-level, unattributed.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Undiagnosed abnormal genital bleeding
      term:
        id: HP:0030012
        label: Abnormal female reproductive system physiology
      binding: BROADER
    quote: >-
      Undiagnosed abnormal genital bleeding.
    explanation: >-
      Item 1 of "Esterified Estrogens and Methyltestosterone Full and Half-Strength Tablets should not
      be used in women with any of the following conditions:": undiagnosed abnormal genital bleeding.
    status: DRAFT
    notes: >-
      No HP or MONDO term for abnormal genital bleeding (searched HP "genital bleeding", "genital",
      "uterine bleeding", "vaginal bleeding", "postmenopausal"; MONDO "vagin"). HP:0000140 Abnormality of
      the menstrual cycle, used for "abnormal uterine bleeding" in the contraceptive files, does not fit
      menopausal women, and HP:0033840 Postmenopausal bleeding adds a restriction the words do not
      state, so the parent HP Abnormal female reproductive system physiology, BROADER. HP:0034263
      Abnormal vaginal bleeding is the closest sign; a reviewer may prefer it. "Undiagnosed" describes
      the workup, not the condition. Grounding store maps the text to sssom:NoTermFound.
  - relation: CONTRAINDICATED_IN
