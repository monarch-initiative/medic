    explanation: >-
      Item 2 of "... should not be used in women with any of the following conditions:": known,
      suspected, or past cancer of the breast.
    status: DRAFT
    notes: >-
      "Known, suspected, or history of" qualifies one condition; no slot records certainty or a
      temporal scope, so one claim.
  - relation: CONTRAINDICATED_IN
