notes: >-
  The Contraindications section has two lists: one for the product ("Esterified Estrogens and
  Methyltestosterone Full and Half-Strength Tablets should not be used in women with any of the
  following conditions:") and one for methyltestosterone ("Methyltestosterone should not be used
  in:"). Claims from the second list are attributed to methyltestosterone on its list lead; claims
  from the first are product-level. Not curated: item 7 ("known hypersensitivity to its ingredients",
  allergy to the product itself); "There is no indication ... in pregnancy" and the following
  sentence on birth defects (restate item 8 / give background, no further claim). The label has no
  Highlights; one copy of each section.
