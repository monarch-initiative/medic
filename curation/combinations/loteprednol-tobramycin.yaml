    title: 'These highlights do not include all the information needed to use ZYLET safely and effectively.
      See full prescribing information for ZYLET.ZYLET® (loteprednol etabonate and tobramycin ophthalmic
      suspension) 0.5%/0.3%, for topical ophthalmic use Initial U.S. Approval: 2004'
