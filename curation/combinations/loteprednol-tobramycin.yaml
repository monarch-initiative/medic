  product_name: Zylet
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: steroid-responsive inflammatory ocular conditions
      term:
        id: HP:0100533
        label: Inflammatory abnormality of the eye
      binding: BROADER
    quote: >-
      ZYLET ® (loteprednol etabonate and tobramycin ophthalmic suspension), 0.5%/0.3% is a topical anti-infective
      and corticosteroid combination for steroid-responsive inflammatory ocular conditions for which a
      corticosteroid is indicated and where superficial bacterial ocular infection or a risk of bacterial
      ocular infection exists.
    explanation: >-
      "is a topical anti-infective and corticosteroid combination for steroid-responsive inflammatory
      ocular conditions", in the Indications section, gives TREATS with the inflammatory ocular conditions
      as the object. "where superficial bacterial ocular infection or a risk of bacterial ocular infection
      exists" names two alternative settings (an existing infection, or only a risk of one), so neither
      is recorded as a disease context.
    status: DRAFT
    notes: >-
      HP Inflammatory abnormality of the eye (exact synonym "Ocular inflammation") is BROADER because
      "steroid-responsive" narrows it. Product-level sentence (ZYLET), unattributed; the Highlights restate
      it ("ZYLET is a combination of loteprednol etabonate, a corticosteroid, and tobramycin, an aminoglycoside
      antibacterial, indicated for ..."), which names the components' classes but assigns the indication
      to the product. The bacterial-infection clause states a setting of use, not a treatment of the infection,
      so no TREATS-infection claim is made from it; the anti-infective's role is curated from the "risk
      of superficial ocular infection" sentence instead.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: inflammatory conditions of the palpebral and bulbar conjunctiva, cornea and anterior segment
        of the globe
      member: inflammatory conditions of the palpebral
      term:
        id: MONDO:0003799
        label: conjunctivitis
      binding: BROADER
    examples:
    - text: allergic conjunctivitis
      term:
        id: MONDO:0005642
        label: atopic conjunctivitis
      binding: EXACT
    - text: acne rosacea
      term:
        id: MONDO:0006604
        label: rosacea
      binding: EXACT
    quote: >-
      Ocular steroids are indicated in inflammatory conditions of the palpebral and bulbar conjunctiva,
      cornea and anterior segment of the globe such as allergic conjunctivitis, acne rosacea, superficial
      punctate keratitis, herpes zoster keratitis, iritis, cyclitis, and where the inherent risk of steroid
      use in certain infective conjunctivitides is accepted to obtain a diminution in edema and inflammation.
    explanation: >-
      "Ocular steroids are indicated in inflammatory conditions of the palpebral ... conjunctiva", in
      this product's Indications section, gives TREATS; this claim covers the palpebral conjunctiva member
      of the site list. The member is written "inflammatory conditions of the palpebral" and stands for
      the palpebral conjunctiva: the head "conjunctiva" is shared with "bulbar".
    status: DRAFT
    notes: >-
      The subject is the drug class "Ocular steroids", not a named ingredient, so the claim is not attributed
      (the class points to loteprednol, but the label does not name it here). conjunctivitis is BROADER
      than inflammation of the palpebral conjunctiva alone; MONDO has no site-specific term. The validator's
      parse of this nested coordination ("palpebral and bulbar conjunctiva" inside a comma list) does
      not offer "inflammatory conditions of the palpebral conjunctiva" as a member, so the member omits
      the shared head (tooling gap). The label's examples ("such as ...") are listed on the member whose
      site they name. "acne rosacea" names no ocular site; it is listed on the two conjunctiva members
      (MONDO has rosacea conjunctivitis), as vaccinia and varicella are listed on both viral contraindication
      members.
