  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: superficial ocular infection
      term:
        id: MONDO:0043885
        label: eye infectious disorder
      binding: BROADER
    quote: >-
      The use of a combination drug with an anti-infective component is indicated where the risk of superficial
      ocular infection is high or where there is an expectation that potentially dangerous numbers of
      bacteria will be present in the eye.
    explanation: >-
      "The use of a combination drug with an anti-infective component is indicated where the risk of superficial
      ocular infection is high" is read as prevention of superficial ocular infection: the label does
      not say "prevent", but it indicates the anti-infective component for patients at high risk of that
      infection. "potentially dangerous numbers of bacteria will be present in the eye" is an alternative
      setting and names no separate condition.
    status: DRAFT
    notes: >-
      eye infectious disorder is BROADER: "superficial" narrows it, and MONDO has no superficial or bacterial
      eye infection term (searched "bacterial eye", "eye infection"). The sentence names the anti-infective
      only by its role ("an anti-infective component"), never the ingredient, so the claim is not attributed.
      The next sentence names tobramycin ("The particular anti-infective drug in this product (tobramycin)
      is active against ..."), but it states antibacterial activity, not this claim, and is a separate
      sentence. The organism list that follows ("active against the following common bacterial eye pathogens")
      is microbiology, not a claim, and there is no causative-organism slot to hold it.
  - relation: CONTRAINDICATED_IN
