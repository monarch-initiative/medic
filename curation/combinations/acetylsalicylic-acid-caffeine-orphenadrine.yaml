notes: >-
  Old-format (non-PLR) label. The first indication sentence speaks for the product; the second assigns
  its indication to "The orphenadrine component" and is attributed. The first contraindication
  sentence names orphenadrine's anticholinergic effect as the reason for each listed condition, so
  each of those claims is attributed to orphenadrine (STATED_REASON); myasthenia gravis, in the next
  sentence, is product-level. Not curated: "patients known to be sensitive to aspirin or caffeine" and
  "a previous hypersensitivity to the drug" (allergy to the product's own ingredients).
