  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: acute painful musculoskeletal conditions
      term:
        id: MONDO:0002081
        label: musculoskeletal system disorder
      binding: BROADER
    quote: >-
      The orphenadrine component is indicated as an adjunct to rest, physical therapy, and other
      measures for the relief of discomfort associated with acute painful musculoskeletal conditions.
    attributed_to:
    - ingredient: CHEBI:7789
      basis: COMPONENT_STATEMENT
      snippet: The orphenadrine component is indicated
      explanation: >-
        The sentence assigns this indication, relief of discomfort in acute painful musculoskeletal
        conditions, to the orphenadrine component.
    explanation: >-
      "indicated ... for the relief of discomfort associated with acute painful musculoskeletal
      conditions" is relief of the symptoms of those conditions, so AMELIORATES_CONDITION with the
      conditions as the object (the "treatment of symptoms of X" pattern). "acute painful" narrows
      MONDO musculoskeletal system disorder, so BROADER.
    status: DRAFT
    notes: >-
      "discomfort" has no term (searched HP "discomfort", "pain"); it is the symptom being relieved,
      so the conditions are the object rather than a context. "as an adjunct to rest, physical
      therapy, and other measures" names non-drug co-therapies; kept in the quote and not recorded in
      in_combination_with, which is used for named treatments. The next sentences (mode of action,
      "do not directly relax tense skeletal muscles") make no claim.
