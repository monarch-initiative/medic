notes: >-
  Not curated: "Major surgery with prolonged immobilization" (a procedure and the immobility after it, not
  a condition the patient has; no claim object); "Hypersensitivity to any component of this product" (allergy
  to the product itself); women receiving hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
  with or without dasabuvir (drug interaction, no condition). This older-format label has no Highlights
  and no thrombotic risk-factor heading; each listed condition is its own claim.
