    explanation: >-
      "indicated for the prevention of pregnancy" is contraception: PREVENTATIVE_FOR_CONDITION with pregnancy
      as the object; "in women" gives the sex.
    status: DRAFT
    notes: >-
      "who elect to use oral contraceptives as a method of contraception" is a population criterion, not
      a co-therapy. Object unbound (no configured ontology has a pregnancy term). The parenthetical generic
