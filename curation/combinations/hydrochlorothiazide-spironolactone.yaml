notes: >-
  The SPL title is empty; the product name is as the skeleton gave it. Not claimed: the opening
  tumorigenicity statement (a warning); the class-level cardiovascular-outcomes paragraph after the
  hypertension indication (the label says no trials show risk reduction with this product);
  "Usage in Pregnancy" text on toxemia ("Diuretics do not prevent ...", negated), dependent edema
  and physiologic hypervolemia of pregnancy (stated not to need diuretics, or "may provide relief"
  for diuretics in general). All claims are product-level: the label never assigns an indication
  or contraindication to spironolactone or hydrochlorothiazide.
