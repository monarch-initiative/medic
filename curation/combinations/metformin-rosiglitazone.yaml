      "NYHA", "heart failure"), so heart failure, BROADER, as in the metformin/pioglitazone file.
      The object text starts at "Class" because the validator drops the "(NYHA)" parenthesis when
      it expands members of the longer phrase (known gap). The label contraindicates initiation of
