  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: renal disease or renal dysfunction
      member: renal disease
      term:
        id: MONDO:0005240
        label: kidney disorder
      binding: EXACT
    quote: >-
      Use in patients with renal disease or renal dysfunction
    explanation: >-
      In the Contraindications section, "Use in patients with renal disease or renal dysfunction"
      lists renal disease as a contraindicated condition; this claim covers that member of the
      coordination.
    status: DRAFT
    notes: >-
      Product-level, unattributed. MONDO kidney disorder has the exact synonym "renal disease". The creatinine thresholds in the following parenthesis are diagnostic examples. The Highlights restate this as "significant renal disease or renal dysfunction"; the full-text item is curated.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: renal disease or renal dysfunction
      member: renal dysfunction
      term:
        id: HP:0012211
        label: Abnormal renal physiology
      binding: EXACT
    quote: >-
      Use in patients with renal disease or renal dysfunction
    explanation: >-
      In the Contraindications section, "Use in patients with renal disease or renal dysfunction"
      lists renal dysfunction as a contraindicated condition; this claim covers that member of the
      coordination.
    status: DRAFT
    notes: >-
      Product-level, unattributed. HP Abnormal renal physiology (exact synonym "Abnormal renal function") is what "renal dysfunction" says, as in the glipizide/metformin file of PR #74. The causes from which renal dysfunction "may also result" (cardiovascular collapse (shock), acute myocardial infarction, septicemia) are not claimed.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: acute or chronic metabolic acidosis
      term:
        id: MONDO:0000440
        label: metabolic acidosis
      binding: EXACT
    examples:
    - text: diabetic ketoacidosis
      term:
        id: MONDO:0012819
        label: diabetic ketoacidosis
      binding: EXACT
    quote: >-
      Use in patients with acute or chronic metabolic acidosis, including diabetic ketoacidosis,
      with or without coma.
    explanation: >-
      In the Contraindications section, "Use in patients with acute or chronic metabolic acidosis,
      including diabetic ketoacidosis, with or without coma" lists metabolic acidosis as a
      contraindicated condition; "acute or chronic" is an exhaustive pair covering the whole class,
      and "including diabetic ketoacidosis" names an example.
    status: DRAFT
    notes: >-
      Product-level, unattributed. One claim for the class (exhaustive pair), diabetic ketoacidosis
      as a listed example; "with or without coma" does not restrict it.
notes: >-
  Not claimed: the Limitations of Use (type 1 diabetes, "for the treatment of diabetic
  ketoacidosis", coadministration with insulin "not recommended"); the use in patients undergoing
  radiologic studies with intravascular iodinated contrast (a procedure, not a condition); the
  causes of renal dysfunction (shock, acute MI, septicemia). The Highlights restate the
  indication and contraindications. The label names no component for any indication or
  contraindication, so nothing is attributed. The Contraindications items are verbless noun
  phrases ("Initiation in ...", "Use in ...") under the section heading; the section itself
  supplies the contraindication.
