  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
      binding: EXACT
    quote: >-
      After consultation with a healthcare professional who has considered and advised the patient
      of the risks and benefits of rosiglitazone, AVANDAMET ® is indicated as an adjunct to diet and
      exercise to improve glycemic control when treatment with both rosiglitazone and metformin is
      appropriate in adults with type 2 diabetes mellitus
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      "AVANDAMET ® is indicated ... to improve glycemic control ... in adults with type 2 diabetes
      mellitus" states treatment of type 2 diabetes mellitus; "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed: the subject is the product (AVANDAMET); rosiglitazone and
      metformin are named only in the counselling lead-in and in "when treatment with both
      rosiglitazone and metformin is appropriate", neither of which assigns the indication to one
      of them. The patient criteria that follow ("who either are: already taking rosiglitazone, or
      not already taking rosiglitazone and unable to achieve glycemic control on other diabetes
      medications and ... have decided not to take pioglitazone ...") are alternatives mixing prior
      therapy with a treatment decision, so they are left in the label and not recorded as
      line_of_therapy. This differs from the metformin/pioglitazone (ACTOPLUS MET) file, whose
      clause is prior therapy in both alternatives and is recorded as line_of_therapy; here the
      second alternative admits patients on no rosiglitazone who have chosen against pioglitazone. "as an adjunct to diet and exercise" names non-drug measures.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Class III or IV heart failure
      member: Class III heart failure
      term:
        id: MONDO:0005252
        label: heart failure
      binding: BROADER
    quote: >-
      Initiation in patients with established New York Heart Association (NYHA) Class III or IV
      heart failure
    explanation: >-
      In the Contraindications section, "Initiation in patients with established New York Heart
      Association (NYHA) Class III or IV heart failure" states a contraindication in NYHA class III
      heart failure; this claim covers that member of the coordination.
    status: DRAFT
    notes: >-
      Product-level, unattributed: the item cites the Boxed Warning, not an ingredient. No MONDO or
      HP term carries the NYHA class (searched HP "NYHA", "class III", "heart failure"; MONDO
      "NYHA", "heart failure"), so heart failure, BROADER, as in the metformin/pioglitazone file.
      The object text starts at "Class" because the validator drops the "(NYHA)" parenthesis when
      it expands members of the longer phrase (known gap). The label contraindicates initiation of
      the product in these patients; the claim records the condition.
