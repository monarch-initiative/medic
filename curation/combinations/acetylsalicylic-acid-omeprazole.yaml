    section: INDICATIONS
    object:
      text: nonfatal stroke
      term:
        id: MONDO:0005098
        label: stroke disorder
      binding: EXACT
    quote: >-
        The aspirin component of ASPIRIN AND OMEPRAZOLE DELAYED-RELEASE TABLETSA is indicated for:
        reducing the combined risk of death and nonfatal stroke in patients who have had ischemic
        stroke or transient ischemia of the brain due to fibrin platelet emboli
    attributed_to:
    - ingredient: CHEBI:15365
      basis: COMPONENT_STATEMENT
      snippet: The aspirin component of ASPIRIN AND OMEPRAZOLE DELAYED-RELEASE TABLETSA is indicated for
      explanation: >-
        The sentence assigns the indications it lists, this stroke-risk reduction first among them,
        to the aspirin component.
    disease_context:
      text: ischemic stroke or transient ischemia of the brain due to fibrin platelet emboli
      member: ischemic stroke
      term:
        id: MONDO:1060198
        label: ischemic stroke
      binding: EXACT
    explanation: >-
      "indicated for: reducing the combined risk of death and nonfatal stroke" is prevention of
      stroke; "in patients who have had ischemic stroke or transient ischemia of the brain due to
      fibrin platelet emboli" is the disease context, of which this claim covers the member
      "ischemic stroke". "nonfatal" describes the event, not a kind of stroke.
    status: DRAFT
    notes: >-
      Secondary prevention. "death" in the combined endpoint is an outcome, not a condition. The
      transient-ischemia context is a separate claim.
