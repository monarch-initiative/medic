    explanation: >-
      An item of the "is contraindicated in:" list: patients with known allergy to other NSAIDs
      (cross-sensitivity). Aspirin is named as an allergen, not as a cause, and as the product's own
      ingredient it is not a specialization.
    status: DRAFT
    notes: >-
      drug allergy is NARROWER than the bare word "allergy", justified by "to aspirin and other ...
      NSAIDs" in the quote. The Highlights item "History of asthma, urticaria, or other
      allergic-type reactions after taking aspirin or other NSAIDs" restates this contraindication
      and is not a separate claim.
