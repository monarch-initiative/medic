notes: >-
  Not claimed: the product-level sentence ("patients who require aspirin for secondary prevention
  of cardiovascular and cerebrovascular events and who are at risk of developing aspirin
  associated gastric ulcers") describes a population; the revascularization item (CABG/PTCA) is a
  procedure; Limitations of Use (acute coronary syndrome, acute myocardial infarction, PCI; "has
  not been shown to reduce the risk of gastrointestinal bleeding") produce no claims; the
  rilpivirine contraindication is a drug interaction with no condition; in "known
  hypersensitivity to aspirin, omeprazole, substituted benzimidazoles, or to any of the
  excipients" only the benzimidazole cross-sensitivity is curated (aspirin, omeprazole and the
  excipients are the product's own). "Aspirin may cause severe urticaria, angioedema, or
  bronchospasm (asthma)" states a risk, not a contraindicated condition. The Highlights copies
  restate the full-text claims.
