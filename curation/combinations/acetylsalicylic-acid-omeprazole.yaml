    status: DRAFT
    notes: >-
      gastric ulcer + specialization aspirin composes "aspirin-associated gastric ulcer"; no
      drug-induced or aspirin-induced gastric ulcer term (searched MONDO "gastric ulcer",
      "peptic ulcer", "aspirin"; HP "gastric ulcer"). "age (≥ 55) or documented history of gastric
      ulcers" are alternative risk criteria, so no age_range is recorded.
  - relation: CONTRAINDICATED_IN
