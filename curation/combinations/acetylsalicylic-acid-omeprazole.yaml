      term:
        id: MONDO:0008834
        label: asthma, nasal polyps, and aspirin intolerance
      binding: NARROWER
    quote: >-
      in patients with the syndrome of asthma, rhinitis, and nasal polyps.
    explanation: >-
      Continues "is contraindicated in: ... and in patients with the syndrome of asthma, rhinitis,
      and nasal polyps": a contraindication in one named syndrome, not in its three parts.
    status: DRAFT
    notes: >-
      Samter's triad / aspirin-exacerbated respiratory disease. MONDO:0008834 (OMIM:208550) names
      the triad; NARROWER because it adds aspirin intolerance, which this clause does not state.
      Kept despite its MONDO placement under hereditary disease (see
      issues/06-mondo-aerd-triad-under-hereditary-disease.md); the alternative MONDO:0850287
      aspirin-induced respiratory disease is an intrinsic-asthma term that covers neither rhinitis
      nor nasal polyps. Unattributed: the next sentence ("Aspirin may cause severe urticaria,
      angioedema, or bronchospasm (asthma).") points at aspirin but names no tie to this clause,
      and it explains the NSAID-allergy item equally.
