  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: steroid-responsive inflammatory ocular conditions
      term:
        id: HP:0100533
        label: Inflammatory abnormality of the eye
      binding: BROADER
    quote: >-
      Tobramycin and dexamethasone ophthalmic suspension is indicated for steroid-responsive
      inflammatory ocular conditions for which a corticosteroid is indicated and where superficial
      bacterial ocular infection or a risk of bacterial ocular infection exists.
    explanation: >-
      "is indicated for steroid-responsive inflammatory ocular conditions" gives TREATS with the
      inflammatory ocular conditions as the object. "where superficial bacterial ocular infection
      or a risk of bacterial ocular infection exists" names two alternative settings (an existing
      infection, or only a risk of one), so neither is recorded as a disease context.
    status: DRAFT
    notes: >-
      HP Inflammatory abnormality of the eye (exact synonym "Ocular inflammation") is BROADER
      because "steroid-responsive" narrows it. Product-level sentence, unattributed. The
      bacterial-infection clause states a setting of use, not a treatment of the infection, so no
      TREATS-infection claim is made from it; the anti-infective's role is curated from the "risk
      of superficial ocular infection" sentence instead.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: inflammatory conditions of the palpebral and bulbar conjunctiva, cornea and anterior segment of the globe
      member: inflammatory conditions of the palpebral
      term:
        id: MONDO:0003799
        label: conjunctivitis
      binding: BROADER
    quote: >-
      Ocular steroids are indicated in inflammatory conditions of the palpebral and bulbar
      conjunctiva, cornea and anterior segment of the globe where the inherent risk of steroid use
      in certain infective conjunctivitides is accepted to obtain a diminution in edema and
      inflammation.
    explanation: >-
      "Ocular steroids are indicated in inflammatory conditions of the palpebral ... conjunctiva",
      in this product's Indications section, gives TREATS; this claim covers the palpebral
      conjunctiva member of the site list. "to obtain a diminution in edema and inflammation" is
      the aim of that treatment. The member is written "inflammatory conditions of the palpebral"
      and stands for the palpebral conjunctiva: the head "conjunctiva" is shared with "bulbar".
    status: DRAFT
    notes: >-
      The subject is the drug class "Ocular steroids", not a named ingredient, so the claim is not
      attributed (the class points to dexamethasone, but the label does not name it here).
      conjunctivitis is BROADER than inflammation of the palpebral conjunctiva alone; MONDO has no
      site-specific term. The validator's parse of this nested coordination ("palpebral and bulbar
      conjunctiva" inside a comma list) does not offer "inflammatory conditions of the palpebral
      conjunctiva" as a member, so the member omits the shared head (tooling gap).
