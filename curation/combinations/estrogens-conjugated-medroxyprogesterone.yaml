      item 1.1 to reach the list lead that carries the population. No vulvar atrophy term (searched
      MONDO "vulva", "vulvar", "atrophy", "kraurosis", "vulvovaginal atrophy"; HP "vulva", "vulvar
      atrophy", "atroph"), so MONDO vulvar disease, BROADER.
