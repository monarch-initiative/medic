notes: >-
  The label covers PREMPRO and PREMPHASE (two regimens of the same two ingredients) in one document;
  the skeleton's product_name is the SPL's first product, Prempro. All claims are product-level ("an
  estrogen/progestin"); the label assigns none to an ingredient. Quotes come from the Highlights
  (indications, which carry the population) and the full-text Contraindications, which the Highlights
  restate. This label version prints no Limitations of Use and no hypersensitivity contraindication.
