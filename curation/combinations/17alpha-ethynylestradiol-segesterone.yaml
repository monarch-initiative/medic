notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the label
  gives it as the heading of a risk-factor list ("Examples include females who are known to: ..."), and
  each listed risk factor is its own claim. Not curated: "Hypersensitivity to any of the components of
  ANNOVERA" and the reactions it lists (allergy to the product itself); use of hepatitis C drug combinations
  containing ombitasvir/paritaprevir/ritonavir, with or without dasabuvir (drug interaction, no condition).
  This label lists no pregnancy contraindication. The Highlights copy restates the full-text contraindications
  in shorter form; full-text items are quoted.
