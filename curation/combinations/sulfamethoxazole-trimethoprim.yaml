notes: >-
  Not claimed: the antibacterial-stewardship paragraph at the head of Indications (usage advice);
  "initial episodes of uncomplicated urinary tract infections be treated with a single effective
  antibacterial agent" (usage advice); "not indicated for prophylactic or prolonged administration
  in otitis media" (negated); the under-two-years limited-data sentence (a precaution);
  hypersensitivity to trimethoprim (own ingredient); "pediatric patients less than 2 months of age"
  (a population with no condition; the schema needs a condition object); "concomitant
  administration with dofetilide" (a pure drug interaction, out of scope). The causative organisms
  of each indication have no slot. No claim is attributed: the label speaks of the product
  throughout.
