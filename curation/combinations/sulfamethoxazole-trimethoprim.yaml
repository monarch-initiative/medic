        id: MONDO:0005247
        label: bacterial urinary tract infection
      binding: NARROWER
    quote: >-
      For the treatment of urinary tract infections due to susceptible strains of the following
      organisms: Escherichia coli, Klebsiella species, Enterobacter species, Morganella morganii,
      Proteus mirabilis and Proteus vulgaris.
    explanation: >-
      "For the treatment of urinary tract infections" under the Urinary Tract Infections heading
      gives TREATS; "due to susceptible strains of the following organisms" restricts it to
      infections by the listed bacteria.
    status: DRAFT
    notes: >-
      Bound NARROWER to MONDO bacterial urinary tract infection: every listed organism is a
      bacterium, which justifies the more specific term. The organisms themselves have no slot
      (no causative-organism qualifier). The grounding store maps "urinary tract infections" to HP
      Recurrent urinary tract infections (HP:0000010), which adds a recurrence the label does not
      state; that row looks wrong. "It is recommended that initial episodes of uncomplicated
      urinary tract infections be treated with a single effective antibacterial agent rather than
      the combination" is usage advice and makes no claim. Product-level, unattributed.
