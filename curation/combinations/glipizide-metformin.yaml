  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
      binding: EXACT
    quote: >-
      Glipizide and metformin hydrochloride tablets USP are indicated as an adjunct to diet and
      exercise to improve glycemic control in adults with type 2 diabetes mellitus.
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      "indicated ... to improve glycemic control in adults with type 2 diabetes mellitus" states
      treatment of type 2 diabetes mellitus; "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed: the sentence's subject is the product. "as an adjunct to diet and
      exercise" names non-drug measures, kept in the quote, not in_combination_with.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Renal disease or renal dysfunction
      member: Renal disease
      term:
        id: MONDO:0005240
        label: kidney disorder
      binding: EXACT
    quote: >-
      Glipizide and metformin hydrochloride tablets are contraindicated in patients with: Renal
      disease or renal dysfunction
    explanation: >-
      "are contraindicated in patients with: Renal disease or renal dysfunction" lists renal disease
      as a contraindicated condition; this claim covers that member of the coordination.
    status: DRAFT
    notes: >-
      Product-level, unattributed. MONDO kidney disorder has the exact synonym "renal disease". The
      creatinine thresholds in the following parenthesis are diagnostic examples, not a separate
      condition.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Renal disease or renal dysfunction
      member: renal dysfunction
      term:
        id: HP:0012211
        label: Abnormal renal physiology
      binding: EXACT
    quote: >-
      Glipizide and metformin hydrochloride tablets are contraindicated in patients with: Renal
      disease or renal dysfunction
    explanation: >-
      "are contraindicated in patients with: Renal disease or renal dysfunction" lists renal
      dysfunction as a contraindicated condition; this claim covers that member of the
      coordination.
    status: DRAFT
    notes: >-
      Product-level, unattributed. HP Abnormal renal physiology (exact synonyms "Abnormal renal
      function", "Renal functional abnormality") is what "renal dysfunction" says; HP Renal
      insufficiency would narrow it to failure. The label's examples (serum creatinine thresholds,
      abnormal creatinine clearance) describe how dysfunction is suggested. "which may also result
      from conditions such as cardiovascular collapse (shock), acute myocardial infarction, and
      septicemia" names causes of the renal dysfunction, not contraindicated conditions of their
      own, so they are not claimed.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Acute or chronic metabolic acidosis
      term:
        id: MONDO:0000440
        label: metabolic acidosis
      binding: EXACT
    examples:
    - text: diabetic ketoacidosis
      term:
        id: MONDO:0012819
        label: diabetic ketoacidosis
      binding: EXACT
    quote: >-
      Acute or chronic metabolic acidosis, including diabetic ketoacidosis, with or without coma.
    explanation: >-
      Under "are contraindicated in patients with:", the item "Acute or chronic metabolic acidosis,
      including diabetic ketoacidosis, with or without coma" lists metabolic acidosis as a
      contraindicated condition; "Acute or chronic" is an exhaustive pair covering the whole class,
      and "including diabetic ketoacidosis" names an example.
    status: DRAFT
    notes: >-
      Product-level, unattributed. One claim for the class (exhaustive pair), diabetic ketoacidosis
      as a listed example; "with or without coma" does not restrict it.
notes: >-
  Not claimed: "Known hypersensitivity to glipizide or metformin hydrochloride" (own ingredients);
  "Diabetic ketoacidosis should be treated with insulin" (treatment advice, not a
  contraindication); the conditions from which renal dysfunction "may also result" (causes, not
  contraindications). The label gives no component-specific indication or contraindication, so
  nothing is attributed.
