notes: >-
  Prescription-format label with an Indications and Usage section. The single indication sentence is
  split per symptom (coughs; upper respiratory symptoms, with nasal congestion as its listed example)
  and per condition (allergy; the common cold). No indication or contraindication is assigned to an
  ingredient by name. Not curated: "Hypersensitivity to any of the ingredients" (allergy to the
  product's own ingredients); "Do not use dextromethorphan in patients receiving monoamine oxidase
  inhibitors (MAOI)" (a drug interaction, no condition); "Do not use in the newborn" (an age
  population with no condition; the skill curates pregnancy and lactation states, not age groups); "Antihistamines should not be used to treat
  lower respiratory tract conditions including asthma" (it says what the antihistamine should not be
  used to treat, not that patients with these conditions must not take the product; read as a
  limitation of use, not a contraindication; it would point to brompheniramine, which the label names
  only by class).
