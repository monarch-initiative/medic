    explanation: >-
      "indicated for relief of" gives AMELIORATES_CONDITION. "coughs and upper respiratory symptoms"
      names two conditions; this claim is the member "coughs". "associated with allergy or the common
      cold" names the conditions they occur in; this claim takes the member "allergy" as the disease
      context (one claim per symptom per condition).
    status: DRAFT
    notes: >-
      Reading: "associated with allergy or the common cold" qualifies both coughs and the upper
      respiratory symptoms, not only nasal congestion. MONDO allergic disease has the exact synonym
      "allergy"; an indication context, not an allergy contraindication. Product-level, unattributed.
