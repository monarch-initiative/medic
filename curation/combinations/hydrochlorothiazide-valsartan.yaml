  jurisdiction: USA
  document:
    setid: d09747f0-029e-4090-949b-e939948249b5
    version: 3
    title: 'These highlights do not include all the information needed to use VALSARTAN AND HYDROCHLOROTHIAZIDE
      TABLETS safely and effectively. See full prescribing information for VALSARTAN AND HYDROCHLOROTHIAZIDE
      TABLETS. VALSARTAN AND HYDROCHLOROTHIAZIDE tablets, for oral useInitial U.S. Approval: 1998'
    url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d09747f0-029e-4090-949b-e939948249b5
  product_name: VALSARTAN AND HYDROCHLOROTHIAZIDE
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: hypertension
      term:
        id: HP:0000822
        label: Hypertension
      binding: EXACT
    quote: >-
      Valsartan and hydrochlorothiazide tablets are indicated for the treatment of hypertension, to
      lower blood pressure.
    explanation: >-
      "are indicated for the treatment of hypertension" states treatment of hypertension; "to lower
      blood pressure" gives the means, not another condition.
    status: DRAFT
    notes: >-
      Product-level, unattributed. The Add-On, Replacement and Initial Therapy paragraphs ("may be
      used in patients whose blood pressure is not adequately controlled on monotherapy", "may be
      substituted for the titrated components", "may be used as initial therapy") are alternative
      settings that together do not restrict the indication, so no line_of_therapy and no separate
      claim, as in the azilsartan/chlorthalidone file. HP Hypertension agrees with the grounding
      store.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: anuria
      term:
        id: HP:0100519
        label: Anuria
      binding: EXACT
    quote: >-
      Because of the hydrochlorothiazide component, this product is contraindicated in patients with
      anuria or hypersensitivity to other sulfonamide-derived drugs.
    attributed_to:
    - ingredient: CHEBI:5778
      basis: COMPONENT_STATEMENT
      snippet: Because of the hydrochlorothiazide component
      explanation: >-
        The sentence opens with "Because of the hydrochlorothiazide component", assigning both
        contraindications it lists, anuria among them, to the hydrochlorothiazide component.
    explanation: >-
      "this product is contraindicated in patients with anuria" states the anuria contraindication,
      the first item of the sentence.
    status: DRAFT
    notes: >-
      Attributed to hydrochlorothiazide as in the olmesartan/amlodipine/hydrochlorothiazide file.
      The Highlights restate it ("Anuria;") without the component wording.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: other sulfonamide-derived drugs
      term:
        id: CHEBI:35358
        label: sulfonamide
      binding: BROADER
    quote: >-
      Because of the hydrochlorothiazide component, this product is contraindicated in patients with
      anuria or hypersensitivity to other sulfonamide-derived drugs.
    attributed_to:
    - ingredient: CHEBI:5778
      basis: COMPONENT_STATEMENT
      snippet: Because of the hydrochlorothiazide component
      explanation: >-
        The sentence opens with "Because of the hydrochlorothiazide component", assigning both
        contraindications it lists, the sulfonamide cross-sensitivity among them, to the
        hydrochlorothiazide component.
    explanation: >-
      "contraindicated in patients with ... hypersensitivity to other sulfonamide-derived drugs"
      states a drug-allergy contraindication with other sulfonamide-derived drugs as the agents;
      "other" excludes the product's own ingredients.
    status: DRAFT
    notes: >-
      Attributed to hydrochlorothiazide on the label's "Because of the hydrochlorothiazide
      component", not on the allergen (sulfonamides are other drugs), as in the
      olmesartan/amlodipine/hydrochlorothiazide file. ChEBI sulfonamide is the chemical class,
      broader than "sulfonamide-derived drugs". The Highlights' "Hypersensitivity to any
      sulfonamide-derived drugs or any component" restates it.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: diabetes
      term:
        id: MONDO:0005015
        label: diabetes mellitus
      binding: EXACT
    quote: >-
      Do not coadminister aliskiren with valsartan and hydrochlorothiazide tablets in patients with
      diabetes
    when_coadministered_with:
    - text: aliskiren
      term:
        id: CHEBI:601027
        label: aliskiren
      binding: EXACT
    explanation: >-
      "Do not coadminister aliskiren with valsartan and hydrochlorothiazide tablets in patients with
      diabetes" contraindicates the product in patients with diabetes when given with aliskiren,
      recorded as when_coadministered_with.
    status: DRAFT
    notes: >-
      Holds only with aliskiren co-administration. MONDO diabetes mellitus has the exact synonym
      "diabetes". Not attributed: the sentence speaks of the product by its generic name, not of
      valsartan. The Highlights restate it.
notes: >-
  Not claimed: the class-level cardiovascular-outcomes text after the indication (credited to
  antihypertensive drug classes "including hydrochlorothiazide and the angiotensin II receptor
  blocker (ARB) class to which valsartan principally belongs"; the label says there are no
  controlled trials demonstrating risk reduction with this product, so it neither indicates nor
  attributes); the add-on, replacement and initial-therapy guidance, the "stage 2 hypertension"
  risk statement and the trial-probability figures; hypersensitivity to any component of this
  product (own ingredients). The indication and the aliskiren contraindication are product-level;
  the anuria and sulfonamide contraindications are attributed to hydrochlorothiazide by the
  label's "Because of the hydrochlorothiazide component".
