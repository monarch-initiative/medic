notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications
  section. Uses is an OTC symptom list under "temporarily relieves these symptoms due to hay fever or
  other upper respiratory allergies:": one AMELIORATES_CONDITION claim per symptom per named condition
  (hay fever; other upper respiratory allergies). "temporarily relieves sinus congestion and pressure"
  is its own bullet naming no condition, so its two members carry no context. "reduces swelling of nasal
  passages" and "temporarily restores freer breathing through the nose" are effects, not conditions, and
  are not curated. No use is assigned to an ingredient. Contraindications: the hydroxyzine cross-sensitivity
  is curated; the own-ingredient allergy in the same item and the MAOI item (a drug interaction, no condition)
  are not.
