notes: >-
  Prescription-format label, the codeine-free sibling of codeine-phenylephrine-promethazine.yaml (sibling
  PR #76); curated to that file's decisions. The indication sentence is split per condition (allergy;
  the common cold) with nasal congestion as the listed example of upper respiratory symptoms. Contraindications:
  promethazine's comatose states, hypersensitivity and idiosyncratic reaction to other phenothiazines
  (attributed to promethazine, the subject of "is contraindicated"); phenylephrine's hypertension and
  peripheral vascular insufficiency (attributed to phenylephrine). Not curated: "Antihistamines are contraindicated
  for use in the treatment of lower respiratory tract symptoms, including asthma" (it contraindicates
  a use, not a patient condition; same decision as the sibling file, left for the reviewer); "Phenylephrine
  should not be used in patients known to be hypersensitive to the drug" (allergy to the product's own
  ingredient); "or in those receiving a monoamine oxidase inhibitor (MAOI)" (a drug interaction).
