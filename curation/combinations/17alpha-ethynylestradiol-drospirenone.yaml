  product_name: Drospirenone and Ethinyl Estradiol
  claims:
  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: pregnancy
      term_gap: >-
        searched MONDO "pregnancy", "pregnan", "contracept"; HP "pregnancy", "pregnant", "pregnan";
        PATO "pregnan": no term for pregnancy as a state (only pregnancy disorders, exposures and
        modifiers); the grounding store's UMLS:C0032961 is in no configured ontology
    quote: >-
      Drospirenone and ethinyl estradiol tablets are indicated for use by females of reproductive
      potential to prevent pregnancy.
    sex:
      text: females
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    life_stage:
      text: of reproductive potential
      term_gap: >-
        searched HsapDv "adult", "menarche", "menopause"; PATO "female" (female fertile describes
        fertility, not a stage); HP "menarche": no reproductive-age life-stage term (adult stage
        would drop the restriction)
    explanation: >-
      "indicated for use by females of reproductive potential to prevent pregnancy" is contraception:
      PREVENTATIVE_FOR_CONDITION with pregnancy as the object; "females" gives the sex and "of
      reproductive potential" the life stage.
    status: DRAFT
    notes: >-
      Quoted from section 1.1 of the full text; the Highlights summary restates it ("Prevent
      pregnancy."). Object unbound (no configured ontology has a pregnancy term). Product-level
      claim, unattributed.
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: premenstrual dysphoric disorder
      term:
        id: MONDO:1010182
        label: premenstrual dysphoric disorder
      binding: EXACT
    quote: >-
      Drospirenone and ethinyl estradiol tablets are also indicated for the treatment of symptoms of
      premenstrual dysphoric disorder (PMDD) in females of reproductive potential who choose to use an
      oral contraceptive as their method of contraception.
    sex:
      text: females
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    life_stage:
      text: of reproductive potential
      term_gap: >-
        searched HsapDv "adult", "menarche", "menopause"; PATO "female" (female fertile describes
        fertility, not a stage); HP "menarche": no reproductive-age life-stage term (adult stage
        would drop the restriction)
    explanation: >-
      "indicated for the treatment of symptoms of premenstrual dysphoric disorder" is symptomatic
      treatment, so AMELIORATES_CONDITION with PMDD as the object; "in females of reproductive
      potential" gives the sex and the life stage.
    status: DRAFT
    notes: >-
      "who choose to use an oral contraceptive as their method of contraception" is a population
      criterion, not a co-therapy. Effectiveness beyond three cycles not evaluated and PMS not
      evaluated (negated, no claim). The DSM-IV description of PMDD is background. Product-level.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: moderate acne vulgaris
      term:
        id: MONDO:0011438
        label: acne
      binding: BROADER
    quote: >-
      Drospirenone and ethinyl estradiol tablets are indicated for the treatment of moderate acne
      vulgaris in women at least 14 years of age, who have no known contraindications to oral
      contraceptive therapy and have achieved menarche.
    sex:
      text: women
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    age_range:
      min_years: 14
      text: at least 14 years of age
    life_stage:
      text: achieved menarche
      term_gap: >-
        searched HsapDv "menarche", "adult"; HP "menarche": no post-menarche life-stage term.
        HP:6000309 "Menstruating female between menarche and menopause" is a past-medical-history
        phenotype that also excludes menopause, so it says more than "have achieved menarche"
    explanation: >-
      "indicated for the treatment of moderate acne vulgaris" gives TREATS and the object; "in women
      at least 14 years of age" gives the sex and the age bound; "have achieved menarche" restricts
      the patients to those past menarche, recorded as an unbound life stage.
    status: DRAFT
    notes: >-
      "acne vulgaris" is an exact synonym of MONDO acne; "moderate" narrows, so BROADER. "who have no
      known contraindications to oral contraceptive therapy" is a population criterion with no slot.
      Use only when the patient desires an oral contraceptive (next sentence).
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Renal impairment
      term:
        id: HP:0000083
        label: Renal insufficiency
      binding: EXACT
    quote: >-
      Drospirenone and ethinyl estradiol tablets are contraindicated in females who are known to have or
      develop the following conditions: Renal impairment
    explanation: >-
      "contraindicated in females who are known to have or develop the following conditions:"
      introduces the list; its first item is renal impairment.
    status: DRAFT
    notes: >-
      HP Renal insufficiency is the closest term for impaired renal function, as in the
      drospirenone/ethinyl estradiol/levomefolate file. Grounding store maps "Renal impairment" to
      UMLS:C1565489 Renal Insufficiencies.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Adrenal insufficiency
      term:
        id: MONDO:0000004
        label: adrenocortical insufficiency
      binding: EXACT
    quote: >-
      Drospirenone and ethinyl estradiol tablets are contraindicated in females who are known to have or
      develop the following conditions: Renal impairment Adrenal insufficiency
    explanation: >-
      The second item of "contraindicated in females who are known to have or develop the following
      conditions:" is adrenal insufficiency.
    status: DRAFT
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: Smoke
      term_gap: >-
        searched MONDO "smok", "tobacco", "nicotine"; HP "smok", "tobacco": only nicotine dependence /
        addictive nicotine use, HP:0430133 Tobacco use history (an exposure history, not current
        smoking) and modifiers ("Triggered by smoking"); no term for being a smoker
    quote: >-
      Examples include women who are known to: Smoke, if over age 35
    age_range:
      min_years: 35
      text: over age 35
    explanation: >-
      Contraindicated as a thrombotic risk factor: smoking is listed after "A high risk of arterial or
      venous thrombotic diseases. Examples include women who are known to:"; "if over age 35"
      restricts it, recorded as age_range.
    status: DRAFT
    notes: >-
      A risk factor rather than a disease; unbound for lack of a term. "over" is a strict bound;
      age_range has no exclusive bound, so min_years 35 is the nearest encoding.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: deep vein thrombosis or pulmonary embolism
      member: deep vein thrombosis
      term:
        id: HP:0002625
        label: Deep venous thrombosis
      binding: EXACT
    quote: >-
      Have deep vein thrombosis or pulmonary embolism, now or in the past
    explanation: >-
      Contraindicated as a thrombotic risk factor, listed after "Examples include women who are known
      to:". This claim is the member "deep vein thrombosis" of the coordination "deep vein thrombosis
      or pulmonary embolism"; "now or in the past" covers current disease and a past episode.
    status: DRAFT
    notes: >-
      No slot records a temporal scope, so the object alone reads as current disease; the label also
      contraindicates a past episode. No MONDO DVT term, so HP.
