notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the
  label gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."),
  and each listed risk factor is its own claim. Not curated: use of hepatitis C drug combinations
  containing ombitasvir, paritaprevir/ritonavir (drug interaction, no condition). Unlike the
  levomefolate-containing label, this label lists no pregnancy contraindication. The Highlights copy
  of the indications and contraindications restates the full text ("Liver tumors or liver disease",
  "Breast cancer"); the full-text items are quoted.
