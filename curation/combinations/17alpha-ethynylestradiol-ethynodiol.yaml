notes: >-
  Not curated: women receiving hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
  with or without dasabuvir (drug interaction, no condition). This label lists no hypersensitivity contraindication.
  This older-format label has no Highlights and no thrombotic risk-factor heading; each listed condition
  is its own claim. Its list items carry no bullets in the SPL text, so each quote is cut at the item's
  own words.
