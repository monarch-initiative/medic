notes: >-
  Old-format (non-PLR) label with no Highlights. The Contraindications section is split under the
  subheadings "Nadolol" and "Bendroflumethiazide", each paragraph with the ingredient as subject,
  so the nadolol cardiac/respiratory items and the bendroflumethiazide anuria item are attributed
  INGREDIENT_SUBJECT. Not claimed: the class-level cardiovascular-outcomes text after the
  indication (the label says there are no controlled trials demonstrating risk reduction with this
  product); "not indicated for initial therapy of hypertension" (a limitation, negated);
  hypersensitivity to bendroflumethiazide (own ingredient). The indication is product-level.
