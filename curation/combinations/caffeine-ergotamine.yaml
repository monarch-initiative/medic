    explanation: >-
      "Indicated as therapy to abort ... vascular headache" is treatment of an attack of vascular
      headache (the "abort" half of "abort or prevent"); "e.g., migraine, migraine variants or
      so-called histaminic cephalalgia" are the label's examples of the category.
    status: DRAFT
    notes: >-
      No current vascular-headache term (searched MONDO "vascular headache", "headache"; HP
      "vascular headache", "headache"): MONDO's vascular headache (MONDO:0040797) is obsolete, and
      the grounding store still maps the phrase to it, so the validator rejects MONDO headache
      disorder as unrelated (an obsolete-term row in the store should be reviewed). HP Headache is
      the closest
      broader term. "histaminic
      cephalalgia" is the old name of cluster headache (MONDO exact synonyms "histamine
      cephalgia", "histamine headache"). "migraine variants" has no term of its own and is bound
      BROADER to migraine disorder. Product-level claim, unattributed. The prevention half of
      "abort or prevent" is a separate claim. The validator's warning that the quote reads as risk
      reduction comes from "prevent", which belongs to that other claim; "abort" an attack is
      treatment.
