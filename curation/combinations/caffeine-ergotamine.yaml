notes: >-
  Suppository product (MIGERGOT). Not curated: the CYP 3A4 inhibitor contraindication ("ergotamine
  use is contraindicated with these drugs and other potent inhibitors of CYP 3A4") is a pure drug
  interaction with no patient condition; ergotism, vasospasm, ischemia of the extremities and
  cerebral ischemia in that passage are the risks of the interaction, not contraindicated
  conditions. "may cause fetal harm" and "the patient should be apprised of the potential hazard
  to the fetus" are risk and counselling statements. "Hypersensitivity to any of the components"
  is an allergy to the product's own ingredients. No contraindication names caffeine or
  ergotamine as its cause, so none is attributed.
