notes: >-
  Prescription label (PLR format). Indication split per symptom (coughs; upper respiratory symptoms) and
  per condition (allergy; the common cold), each with age_range min 18 from "in patients 18 years of age
  and older", as in codeine-phenylephrine-promethazine.yaml (sibling PR #76). Not curated: the Limitations
  of Use paragraphs (pediatric restrictions, opioid-risk reservation); "All children younger than 12 years
  of age" (an age group with no condition, a known missing slot); "Postoperative pain management in children
  younger than 18 years of age following tonsillectomy and/or adenoidectomy" (a procedure context, not
  a condition; postoperative pain is the use being contraindicated, not a patient condition); "Concurrent
  use of monoamine oxidase inhibitors (MAOIs) or use of MAOIs within 14 days" (a drug interaction); hypersensitivity
  to codeine, promethazine or the inactive ingredients (own ingredients). "in an unmonitored setting or
  in the absence of resuscitative equipment" restricts the asthma contraindication to a care setting;
  no slot, kept in the quote. No claim is attributed: every contraindication is stated of the product
  ("Promethazine HCl and Codeine Phosphate Oral Solution is also contraindicated in patients with:").
