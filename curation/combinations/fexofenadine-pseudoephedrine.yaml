notes: 'OTC Drug Facts label; the Uses text is the indication section. The label has no "Do not use" section (the
  helper reports the Contraindications section absent), so no contraindication is curated. Uses: (1) an OTC symptom
  list under "temporarily relieves these symptoms due to hay fever or other upper respiratory allergies:" (the SPL
  text has lost its bullets; items read as runny nose, sneezing, itchy, watery eyes, itching of the nose or throat):
  one AMELIORATES_CONDITION claim per symptom (coordinated symptoms split per member) per named condition (hay fever,
  other upper respiratory allergies); (2) "temporarily relieves nasal congestion due to the common cold, hay fever
  or other upper respiratory allergies": one claim per condition; (3) "temporarily relieves sinus congestion and
  pressure": one claim per member, no context. "reduces swelling of nasal passages" and "temporarily restores freer
  breathing through the nose" are effects, not conditions, and are not curated. No use is assigned to an ingredient
  by the label, so no claim is attributed. The symptom-list pattern follows the cetirizine / pseudoephedrine (All
  Day Allergy D) record.'
