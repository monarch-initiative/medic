  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: elevated intraocular pressure
      term:
        id: HP:0007906
        label: Ocular hypertension
      binding: EXACT
    quote: >-
      COMBIGAN ® is an alpha adrenergic receptor agonist with a beta adrenergic receptor inhibitor
      indicated for the reduction of elevated intraocular pressure (IOP) in patients with glaucoma
      or ocular hypertension who require adjunctive or replacement therapy due to inadequately
      controlled IOP
    disease_context:
      text: glaucoma or ocular hypertension
      member: glaucoma
      term:
        id: MONDO:0005041
        label: glaucoma
      binding: EXACT
    line_of_therapy:
      text: who require adjunctive or replacement therapy due to inadequately controlled IOP
      term_gap: >-
        A prior-therapy requirement stated in words; no ontology term is sought for a line of
        therapy.
    explanation: >-
      "indicated for the reduction of elevated intraocular pressure (IOP)" gives TREATS with the
      raised pressure as the object; "in patients with glaucoma or ocular hypertension" restricts
      it, and this claim covers the glaucoma member of that coordination. "who require adjunctive
      or replacement therapy due to inadequately controlled IOP" is the prior-therapy
      requirement.
    status: DRAFT
    notes: >-
      HP Ocular hypertension has the exact synonym "Elevated intraocular pressure", so the object
      is the sign the product lowers; the patient's disease goes in disease_context. TREATS rather
      than AMELIORATES_CONDITION: "indicated for the reduction of" a sign is the label's
      indication wording, not symptom relief. The comparison with concomitant timolol and
      brimonidine after the semicolon is efficacy information and makes no claim. Product-level,
      unattributed: the pharmacologic-class wording names no ingredient.
