  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: bronchial asthma
      term:
        id: HP:0002099
        label: Asthma
      binding: EXACT
    quote: >-
      COMBIGAN ® is contraindicated in patients with bronchial asthma; a history of bronchial
      asthma; severe chronic obstructive pulmonary disease
    explanation: >-
      "is contraindicated in patients with bronchial asthma; a history of bronchial asthma" states
      the contraindication for current asthma and extends it to asthma in the past; "a history of"
      describes the patient, not a different condition.
    status: DRAFT
    notes: >-
      One claim covers both list items ("bronchial asthma" and "a history of bronchial asthma"):
      they name the same condition, the schema has no slot for "past" disease, and two identical
      claims would duplicate one edge. HP Asthma has the exact synonym "Bronchial asthma"; MONDO
      has no term with that wording (searched MONDO "bronchial asthma", "asthma"). The grounding
      store maps "bronchial asthma" to UMLS:C0004096. Product-level, unattributed.
