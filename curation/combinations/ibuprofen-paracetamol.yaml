notes: 'OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications section.
  Uses reads "temporarily relieves minor aches and pains due to:" followed by six bulleted items (headache, toothache,
  backache, menstrual cramps, muscular aches, minor pain of arthritis). Each item names a kind of pain, so each
  is one AMELIORATES_CONDITION claim whose object is that pain; for the last item the pain is the object and arthritis
  the disease context. The heading "minor aches and pains" is not curated on its own: the items are what the label
  says it relieves. No use is assigned to an ingredient by the label, so no claim is attributed. Contraindications
  curated: the allergic reaction to "any other pain reliever" (the own-ingredient allergen acetaminophen dropped).
  Not curated: "with any other drug containing acetaminophen (prescription or nonprescription)" (a drug interaction
  with no patient condition); "right before or after heart surgery" (a procedure, not a condition). The pipeline
  listed this product''s ibuprofen as dexibuprofen (a combination_split row in mappings/drug_grounding.sssom.tsv
  maps "IBUPROFEN" to CHEBI:43415 dexibuprofen); the SPL active moiety is IBUPROFEN and the label helper grounds
  it to CHEBI:5855 ibuprofen, which this file uses.'
