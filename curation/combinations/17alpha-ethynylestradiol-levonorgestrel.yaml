notes: >-
  The high risk of arterial or venous thrombotic diseases is not curated as a claim of its own: the label
  gives it as the heading of a risk-factor list ("Examples include women who are known to: ..."), and
  each listed risk factor is its own claim. Not curated: use of hepatitis C drug combinations containing
  ombitasvir/paritaprevir/ritonavir, with or without dasabuvir (drug interaction, no condition). This
  label lists no pregnancy contraindication and no hypersensitivity contraindication. This older-format
  label has no Highlights; the bracketed cross-references ("[see WARNINGS (1) ]") are left out of the
  quotes.
