  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: allergic reactions
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: penicillins
      term:
        id: CHEBI:17334
        label: penicillin
      binding: EXACT
    - text: cephalosporins
      term:
        id: CHEBI:23066
        label: cephalosporin
      binding: EXACT
    - text: beta-lactamase inhibitors
      term:
        id: CHEBI:35625
        label: EC 3.5.2.6 (beta-lactamase) inhibitor
      binding: EXACT
    quote: >-
      Piperacillin and tazobactam for injection is contraindicated in patients with a history of
      allergic reactions to any of the penicillins, cephalosporins, or beta-lactamase inhibitors.
    explanation: >-
      "is contraindicated in patients with a history of allergic reactions to any of the
      penicillins, cephalosporins, or beta-lactamase inhibitors" states a drug-allergy
      contraindication (the allergic reactions are to drugs, so drug allergy, NARROWER than the
      words) with the three drug classes as the agents.
    status: DRAFT
    notes: >-
      Cross-sensitivity to three drug classes. Piperacillin is itself a penicillin and tazobactam a
      beta-lactamase inhibitor, but the label names the classes, not the ingredients, and the
      classes include other agents, so they are kept (cephalosporins are wholly other agents).
      ChEBI penicillin (CHEBI:17334) and cephalosporin (CHEBI:23066) are the class terms. "a history
      of" makes it a past reaction; recorded in this note only. Unattributed: allergens are not
      causes.
notes: >-
  Not claimed: the Highlights summary list (it restates subsections 1.1-1.5 with the same
  conditions); section 1.6 "Usage" (antimicrobial-stewardship text naming no condition). All
  claims are product-level: the label never assigns an indication to piperacillin or tazobactam.
  The causative organisms named in every indication have no slot in the schema and stay in the
  quotes; the subsection headings ("Intra-abdominal Infections", "Female Pelvic Infections") are
  not curated as objects because each subsection's sentence names its own conditions.
