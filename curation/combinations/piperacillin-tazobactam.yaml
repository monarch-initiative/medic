  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: appendicitis (complicated by rupture or abscess)
      term:
        id: MONDO:0005649
        label: appendicitis
      binding: BROADER
    quote: >-
      Piperacillin and tazobactam for injection is indicated in adults and pediatric patients (2
      months of age and older) for the treatment of appendicitis (complicated by rupture or
      abscess) and peritonitis caused by beta-lactamase producing isolates of Escherichia coli or
      the following members of the Bacteroides fragilis group: B. fragilis , B. ovatus , B.
      thetaiotaomicron , or B. vulgatus .
    age_range:
      min_years: 0.1667
      text: 2 months of age and older
    explanation: >-
      "is indicated ... for the treatment of appendicitis (complicated by rupture or abscess)"
      states treatment of complicated appendicitis; the parenthetical names two complications of
      one condition, not two conditions, so the claim has no member; "adults and pediatric
      patients (2 months of age and older)" gives the age bound (2 months = 0.1667 years).
    status: DRAFT
    notes: >-
      Product-level, unattributed. No complicated- or perforated-appendicitis term (searched
      MONDO "appendicitis", "perforated appendicitis", "complicated appendicitis"); appendicitis is
      broader. MONDO appendicitis (a disease) is chosen over the grounding store's HP:6000143
      Appendicitis (a morphology phenotype). The causative organisms ("caused by beta-lactamase
      producing isolates of Escherichia coli or ... Bacteroides fragilis group") restrict the
      indication but have no slot in the schema; they stay in the quote. "appendicitis (...) and
      peritonitis" joins two conditions; each claim uses its own item as text rather than the
      whole phrase with a member, because the parenthetical inside the first item would not
      expand into members.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: peritonitis
      term:
        id: MONDO:0004522
        label: infectious peritonitis
      binding: NARROWER
    quote: >-
      Piperacillin and tazobactam for injection is indicated in adults and pediatric patients (2
      months of age and older) for the treatment of appendicitis (complicated by rupture or
      abscess) and peritonitis caused by beta-lactamase producing isolates of Escherichia coli or
      the following members of the Bacteroides fragilis group: B. fragilis , B. ovatus , B.
      thetaiotaomicron , or B. vulgatus .
    age_range:
      min_years: 0.1667
      text: 2 months of age and older
    explanation: >-
      "is indicated ... for the treatment of ... peritonitis" states treatment of peritonitis;
      "caused by beta-lactamase producing isolates of Escherichia coli or ... Bacteroides fragilis
      group" makes it infectious, so infectious peritonitis, NARROWER than the word; "adults and
      pediatric patients (2 months of age and older)" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed. The grounding store maps "peritonitis" to MONDO peritonitis
      (MONDO:1010128), the parent of the bound term. The causative organisms stay in the quote
      (no schema slot).
  - relation: TREATS
    section: INDICATIONS
    object:
      text: nosocomial pneumonia (moderate to severe)
      term:
        id: MONDO:0005249
        label: pneumonia
      binding: BROADER
    quote: >-
      Piperacillin and tazobactam for injection is indicated in adults and pediatric patients (2
      months of age and older) for the treatment of nosocomial pneumonia (moderate to severe)
      caused by beta-lactamase producing isolates of Staphylococcus aureus and by piperacillin and
      tazobactam-susceptible Acinetobacter baumannii , Haemophilus influenzae , Klebsiella
      pneumoniae , and Pseudomonas aeruginosa (Nosocomial pneumonia caused by P. aeruginosa should
      be treated in combination with an aminoglycoside)
    age_range:
      min_years: 0.1667
      text: 2 months of age and older
    explanation: >-
      "is indicated ... for the treatment of nosocomial pneumonia (moderate to severe)" states
      treatment of nosocomial pneumonia; "adults and pediatric patients (2 months of age and
      older)" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed. No nosocomial- or hospital-acquired-pneumonia term (searched
      MONDO "pneumonia", "nosocomial", "hospital", "hospital-acquired pneumonia"); MONDO pneumonia
      is broader (it also lacks the "moderate to severe" severity). MONDO bacterial pneumonia
      (MONDO:0004652) was considered but classifies by cause, not by setting, so it is not broader
      than "nosocomial pneumonia". Grounding store maps the
      phrase to UMLS:C0949083. The parenthetical "should be treated in combination with an
      aminoglycoside" applies only to the P. aeruginosa subset, so it is not recorded as
      in_combination_with on the whole indication; a reviewer may want a separate claim for it.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: skin and skin structure infections
      term:
        id: MONDO:0024295
        label: skin disease caused by bacterial infection
      binding: NARROWER
    examples:
    - text: cellulitis
      term:
        id: MONDO:0005230
        label: cellulitis
      binding: EXACT
    - text: cutaneous abscesses
      term:
        id: HP:0031292
        label: Cutaneous abscess
      binding: EXACT
    - text: ischemic/diabetic foot infections
      term_gap: >-
        searched MONDO "diabetic foot", "diabetic foot infection", "foot infection"; HP "diabetic
        foot", "foot ulcer": no foot-infection term. Grounding store maps the phrase to
        UMLS:C0744130.
    quote: >-
      Piperacillin and tazobactam for injection is indicated in adults for the treatment of
      uncomplicated and complicated skin and skin structure infections, including cellulitis,
      cutaneous abscesses and ischemic/diabetic foot infections caused by beta-lactamase producing
      isolates of Staphylococcus aureus .
    age_range:
      min_years: 18
      text: adults
    explanation: >-
      "is indicated in adults for the treatment of uncomplicated and complicated skin and skin
      structure infections" states treatment of skin and skin structure infections ("uncomplicated
      and complicated" together cover the whole class); the members after "including" are
      examples; "adults" gives the age bound.
    status: DRAFT
    notes: >-
      Product-level, unattributed. "Skin and skin structure infections" is the regulatory category
      for infections of the skin and the tissue under it; no term names it (searched MONDO "skin
      and skin structure", "skin infection", "soft tissue infection"; the grounding store has
      sssom:NoTermFound for the phrase). Bound NARROWER to MONDO skin disease caused by bacterial
      infection: "caused by beta-lactamase producing isolates of Staphylococcus aureus" makes the
      infections bacterial, and the term covers the cellulitis example (MONDO skin infection,
      MONDO:0021201, does not, and was not used). The term covers the skin only, not the deeper
      skin structures, which is a further reason it is NARROWER. A reviewer may prefer a term_gap.
      Organisms stay in the quote.
