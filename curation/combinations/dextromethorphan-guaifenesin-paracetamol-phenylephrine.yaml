notes: >-
  OTC label: the helper prints the Drug Facts "Uses" as Indications and "Do not use" as Contraindications.
  Uses is an OTC symptom list: each symptom listed after "temporarily relieves common cold/flu symptoms:"
  is one AMELIORATES_CONDITION claim per member of the coordination "common cold/flu" (common cold,
  flu) as disease context. The last four list items ("reduces swelling of nasal passages", "temporarily
  restores freer breathing through the nose", "promotes nasal and/or sinus drainage", "helps loosen
  phlegm (mucus) and thin bronchial secretions ...") are effects of the product, not symptoms or conditions,
  and are not curated. No use is assigned to an ingredient by the label, so no claim is attributed.
  Neither "Do not use" item is curated: "with any drug containing acetaminophen" and "if you are now
  taking a prescription monoamine oxidase inhibitor (MAOI) ... or for 2 weeks after stopping the MAOI
  drug" are drug-drug interactions with no patient condition (the parenthesis "certain drugs for depression,
  psychiatric or emotional conditions, or Parkinson's disease" describes what MAOIs are used for).
  The Drug Facts "Ask a doctor before use" warnings are not a contraindications section.
