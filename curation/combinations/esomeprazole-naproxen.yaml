notes: >-
  Not claimed: the product-level sentence ("indicated in adult and adolescent patients 12 years of
  age and older weighing at least 38 kg, requiring naproxen for symptomatic relief of arthritis and
  esomeprazole magnesium to decrease the risk for developing naproxen-associated gastric ulcers")
  describes the population; the component sentences that follow carry the claims. Limitations of
  Use (no substitution, not for initial treatment of acute pain, 6-month studies) give no claims.
  "In the setting of coronary artery bypass graft (CABG) surgery" names a procedure, not a
  condition. "Proton pump inhibitors (PPIs), including esomeprazole magnesium, are contraindicated
  in patients receiving rilpivirine-containing products" is a pure drug interaction. Naproxen and
  esomeprazole magnesium as allergens and "any components of the drug product" are the product's
  own. The Highlights copies restate the full-text claims.
