    quote: >-
      Mucinex Children's Mighty Chews Cough Daytime: temporarily relieves cough due to minor throat
      and bronchial irritation as may occur with a cold
    disease_context:
      text: a cold
      term_gap: >-
        the words mean the common cold (MONDO:0005709 common cold), but the grounding store maps
        "cold" to MONDO:0005002 chronic obstructive pulmonary disease (exact synonym "COLD"), and
        the validator rejects common cold as unrelated to that row. Left unbound until a human adds
        a semapv:ManualMappingCuration row for "cold" -> common cold; searched MONDO "common cold",
        "cold"
    explanation: >-
      "temporarily relieves cough due to minor throat and bronchial irritation" gives
      AMELIORATES_CONDITION for cough; HP Cough is broader than the cause-restricted wording. "as
      may occur with a cold" names the condition the cough occurs in, the common cold, recorded as
      disease context (unbound, see its term_gap).
    status: DRAFT
    notes: >-
      The pack's two products both state this use word for word (Daytime first, then Nighttime); it
      is curated once for the pack, quoted from the Daytime paragraph. The product names ("Mucinex
      Children's Mighty Chews Cough Daytime / Nighttime") are brand names, not ingredients, so
      nothing is attributed.
