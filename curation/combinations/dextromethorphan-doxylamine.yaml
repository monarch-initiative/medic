notes: >-
  OTC Drug Facts label of a co-packaged pack (Mucinex Children's Mighty Chews Cough Daytime and
  Nighttime). The label has no Contraindications ("Do not use") section. Uses gives each product's
  uses under its brand name; the label does not name the ingredients there, and a brand name is not
  an ingredient, so no claim is attributed (it does not say which product contains which ingredient
  in the Uses text). The cough use stated for both products is one claim. The Nighttime symptom list
  under "temporarily relieves these symptoms due to hay fever or other upper respiratory allergies:"
  gives one AMELIORATES_CONDITION claim per symptom per named condition (hay fever; other upper
  respiratory allergies), with "itching of the nose or throat" and "itchy, watery eyes" split into
  their members.
